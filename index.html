<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trustr</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

    :root {
      --grad-top:    #FFAA6B;
      --grad-bot:    #FF5C5C;
      --teal:        #5BA8A0;
      --teal-dark:   #4A9490;
      --teal-light:  #E0F2F1;
      --purple:      #3C0060;
      --purple-mid:  #6B0FA0;
      --danger:      #D93030;
      --danger-light:#FDEAEA;
      --success:     #2E9E6B;
      --success-light:#E0F5EC;
      --warning:     #C97A00;
      --warning-light:#FFF3DC;
      --card:        #F0EEEE;
      --card-border: rgba(0,0,0,0.07);
      --text:        #111111;
      --text-sub:    #555;
      --hdr-h:       64px;
      --tab-h:       48px;
    }

    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(170deg, var(--grad-top) 0%, var(--grad-bot) 100%);
      background-attachment: fixed;
      color: var(--text);
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
    }

    /* ── HEADER ─────────────────────────────────── */
    .header {
      position: fixed; top: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px; height: var(--hdr-h);
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    }
    .logo-wrap { display:flex; align-items:center; gap:8px; }
    .logo-shield {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #FF8C00, #FF4444);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; box-shadow: 0 2px 6px rgba(255,100,0,0.35);
    }
    .logo-text {
      font-size: 20px; font-weight: 900; letter-spacing: 1px;
      background: linear-gradient(135deg, var(--purple) 0%, var(--purple-mid) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header-right { display:flex; align-items:center; gap:8px; }
    .user-switcher {
      display:flex; background:#EDEDED; border-radius:20px; padding:3px; gap:2px;
    }
    .user-btn {
      padding: 4px 10px; border-radius:16px; border:none;
      background:transparent; font-size:12px; font-weight:700;
      color:#777; cursor:pointer; transition:all 0.2s; font-family:inherit;
    }
    .user-btn.active { background:var(--teal); color:white; }

    /* ── TAB BAR ─────────────────────────────────── */
    .tab-bar {
      position: fixed; top: var(--hdr-h); left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px; height: var(--tab-h);
      background: rgba(200,190,190,0.55);
      backdrop-filter: blur(6px);
      display: flex; align-items: center;
      padding: 6px 10px; gap: 6px;
      z-index: 99; overflow-x: auto;
      scrollbar-width: none;
    }
    .tab-bar::-webkit-scrollbar { display:none; }
    .tab-pill {
      flex-shrink: 0; padding: 6px 14px;
      border-radius: 20px; border: none;
      background: rgba(255,255,255,0.3);
      color: rgba(255,255,255,0.9);
      font-size: 13px; font-weight: 700;
      cursor: pointer; transition: all 0.2s;
      font-family: inherit;
    }
    .tab-pill.active {
      background: rgba(255,255,255,0.95);
      color: var(--purple);
    }
    .tab-pill .pill-badge {
      display:inline-flex; align-items:center; justify-content:center;
      background: var(--danger); color:white;
      font-size:10px; font-weight:800;
      width:16px; height:16px; border-radius:50%;
      margin-left:4px; vertical-align:middle;
    }

    /* ── CONTENT ─────────────────────────────────── */
    .content {
      padding-top: calc(var(--hdr-h) + var(--tab-h) + 16px);
      padding-bottom: 28px;
      padding-left: 14px; padding-right: 14px;
      min-height: 100vh;
    }

    /* ── SCREENS ─────────────────────────────────── */
    .screen { display:none; }
    .screen.active { display:block; }

    /* ── SECTION TITLE ───────────────────────── */
    .section-title {
      font-size: 19px; font-weight: 900;
      color: var(--purple); margin-bottom: 14px;
      text-shadow: 0 1px 2px rgba(255,255,255,0.4);
    }

    /* ── CARDS ───────────────────────────────────── */
    .card {
      background: var(--card);
      border-radius: 16px; padding: 14px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.13);
      margin-bottom: 12px;
      border: 1px solid var(--card-border);
      cursor: pointer;
      transition: all 0.15s;
    }
    .card:active { transform: scale(0.98); opacity: 0.9; }

    /* ── STATUS BADGES ───────────────────────────── */
    .badge {
      display:inline-flex; align-items:center; gap:4px;
      padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700;
    }
    .b-requested      { background:var(--warning-light); color:var(--warning); }
    .b-active         { background:var(--success-light);  color:var(--success); }
    .b-pending_return { background:var(--teal-light);     color:var(--teal-dark); }
    .b-returned       { background:#EBEBEB;               color:#555; }
    .b-late           { background:var(--danger-light);   color:var(--danger); }
    .b-lost           { background:#1F2937;               color:white; }

    /* ── BUTTONS ─────────────────────────────────── */
    .btn {
      padding: 11px 16px; border-radius: 25px; border: none;
      font-size: 14px; font-weight: 700; cursor: pointer;
      transition: all 0.15s; display:inline-flex; align-items:center;
      justify-content:center; gap:6px; font-family:inherit;
    }
    .btn:active { transform:scale(0.96); opacity:0.9; }
    .btn-primary { background:var(--teal);    color:white; }
    .btn-success { background:var(--teal);    color:white; }
    .btn-danger  { background:var(--danger);  color:white; }
    .btn-outline { background:transparent; color:var(--teal); border:2px solid var(--teal); }
    .btn-ghost   { background:rgba(255,255,255,0.6); color:var(--text); }
    .btn-full    { width:100%; }
    .btn-sm      { padding:7px 14px; font-size:13px; }

    /* ── FAB (Floating Action Button) ────────────── */
    .fab {
      position:fixed; bottom:28px; right:14px;
      width:56px; height:56px;
      border-radius:50%; border:none;
      background:linear-gradient(135deg, var(--teal), var(--teal-dark));
      color:white; font-size:24px;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; z-index:90;
      box-shadow:0 4px 16px rgba(91,168,160,0.4);
      transition:all 0.2s;
    }
    .fab:active { transform:scale(0.9); }
    .fab.hidden { display:none; }

    /* ── FORM ────────────────────────────────────── */
    .form-group { margin-bottom:14px; }
    .form-label { font-size:12px; font-weight:700; color:var(--text-sub); margin-bottom:6px; display:block; text-transform:uppercase; letter-spacing:.4px; }
    .form-input {
      width:100%; padding:11px 14px;
      border:1.5px solid rgba(0,0,0,0.12); border-radius:12px;
      font-size:15px; outline:none; transition:border-color 0.2s;
      font-family:inherit; color:var(--text); background:white;
    }
    .form-input:focus { border-color:var(--teal); }
    .form-input.error { border-color:var(--danger); background:var(--danger-light); }

    /* ── INNER TABS ─────────────────────────────── */
    .inner-tabs {
      display:flex; gap:0; margin-bottom:16px;
      background:rgba(0,0,0,0.12); border-radius:14px; padding:3px;
    }
    .inner-tab {
      flex:1; padding:8px; text-align:center; border:none;
      background:transparent; border-radius:11px;
      font-size:13px; font-weight:700; color:rgba(255,255,255,0.7);
      cursor:pointer; transition:all 0.2s; font-family:inherit;
    }
    .inner-tab.active { background:white; color:var(--purple); box-shadow:0 1px 4px rgba(0,0,0,0.15); }

    /* ── INFO ROWS ───────────────────────────────── */
    .info-row {
      display:flex; justify-content:space-between; align-items:center;
      padding:7px 0; font-size:13px; border-bottom:1px solid rgba(0,0,0,0.06);
    }
    .info-row:last-child { border-bottom:none; }
    .info-label { color:var(--text-sub); }
    .info-value { font-weight:700; text-align:right; max-width:60%; }

    /* ── DIVIDER ─────────────────────────────────── */
    .divider { height:1px; background:rgba(0,0,0,0.08); margin:12px 0; }

    /* ── EMPTY STATE ─────────────────────────────── */
    .empty-state { text-align:center; padding:48px 24px; }
    .empty-icon  { font-size:52px; margin-bottom:12px; }
    .empty-state p { font-size:15px; font-weight:600; color:rgba(255,255,255,0.85); }

    /* ── ITEM ROW ────────────────────────────────── */
    .item-row { display:flex; align-items:center; gap:12px; }
    .item-emoji {
      font-size:28px; width:50px; height:50px;
      background:rgba(91,168,160,0.15); border-radius:13px;
      display:flex; align-items:center; justify-content:center; flex-shrink:0;
    }
    .item-name { font-size:15px; font-weight:800; margin-bottom:2px; color:var(--text); }
    .item-meta { font-size:12px; color:var(--text-sub); margin-top:1px; }

    /* ── STATS GRID ──────────────────────────────── */
    .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
    .stat-card  { border-radius:14px; padding:14px; text-align:center; background:var(--card); box-shadow:0 2px 8px rgba(0,0,0,0.1); }
    .stat-number { font-size:28px; font-weight:900; color:var(--purple); }
    .stat-label  { font-size:11px; color:var(--text-sub); margin-top:3px; font-weight:700; text-transform:uppercase; letter-spacing:.3px; }

    /* ── DUE CHIP ────────────────────────────────── */
    .due-chip { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:10px; }
    .due-ok   { background:var(--success-light); color:var(--success); }
    .due-soon { background:var(--warning-light);  color:var(--warning); }
    .due-over { background:var(--danger-light);   color:var(--danger); }

    /* ── FRIEND ROW ──────────────────────────────── */
    .friend-row { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid rgba(0,0,0,0.07); }
    .friend-row:last-child { border-bottom:none; }
    .friend-avatar { font-size:32px; width:48px; height:48px; display:flex; align-items:center; justify-content:center; background:rgba(91,168,160,0.15); border-radius:12px; }
    .friend-info { flex:1; }
    .friend-name { font-weight:800; font-size:14px; color:var(--text); }
    .friend-status { font-size:12px; color:var(--text-sub); margin-top:2px; }

    /* ── CHAT ─────────────────────────────────────── */
    .chat-container { display:flex; flex-direction:column; height:60vh; background:white; border-radius:16px; overflow:hidden; }
    .chat-messages { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px; }
    .message { display:flex; gap:8px; margin-bottom:8px; }
    .message.sent { justify-content:flex-end; }
    .message.sent .msg-bubble { background:var(--teal); color:white; }
    .message.received .msg-bubble { background:#EBEBEB; color:var(--text); }
    .msg-bubble { max-width:75%; padding:10px 14px; border-radius:12px; font-size:13px; word-wrap:break-word; line-height:1.4; }
    .chat-input { padding:12px; border-top:1px solid rgba(0,0,0,0.1); display:flex; gap:8px; }
    .chat-input input { flex:1; padding:8px 12px; border:1px solid rgba(0,0,0,0.15); border-radius:20px; font-size:13px; font-family:inherit; outline:none; }
    .chat-input button { padding:8px 14px; background:var(--teal); color:white; border:none; border-radius:20px; cursor:pointer; font-weight:700; font-size:12px; font-family:inherit; }
    .chat-actions { display:flex; gap:8px; padding:12px; border-top:1px solid rgba(0,0,0,0.1); }
    .chat-actions button { flex:1; padding:8px 12px; background:var(--teal); color:white; border:none; border-radius:20px; cursor:pointer; font-weight:700; font-size:12px; font-family:inherit; }

    /* ── PHOTO BOX ───────────────────────────────── */
    .photo-box {
      background:rgba(255,255,255,0.5); border-radius:13px; padding:20px 16px;
      text-align:center; color:#555; cursor:pointer;
      border:2px dashed rgba(0,0,0,0.18); transition:all 0.2s;
    }
    .photo-box:hover { border-color:var(--teal); background:var(--teal-light); }
    .photo-box .photo-icon { font-size:34px; margin-bottom:6px; }
    .photo-box p { font-size:13px; font-weight:600; }

    /* ── EMOJI PICKER ────────────────────────────── */
    .emoji-grid { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:14px; }
    .emoji-opt {
      width:48px; height:48px; border-radius:12px; font-size:26px;
      display:flex; align-items:center; justify-content:center;
      border:3px solid transparent; cursor:pointer;
      background:rgba(0,0,0,0.05); transition:all .15s;
    }
    .emoji-opt.sel { border-color:var(--teal); background:var(--teal-light); }
    .emoji-opt:active { transform:scale(.9); }

    /* ── STARS ───────────────────────────────────── */
    .star-row { display:flex; gap:5px; margin:6px 0 12px; }
    .star { font-size:26px; cursor:pointer; opacity:0.2; transition:opacity 0.15s, transform 0.1s; user-select:none; }
    .star.lit { opacity:1; }
    .star:active { transform:scale(1.3); }

    /* ── REP BAR ─────────────────────────────────── */
    .rep-row { margin-bottom:12px; }
    .rep-header { display:flex; justify-content:space-between; font-size:13px; font-weight:700; margin-bottom:5px; }
    .rep-bar { background:#E0E0E0; border-radius:8px; height:9px; overflow:hidden; }
    .rep-fill { height:100%; border-radius:8px; transition:width 0.6s ease; }

    /* ── REQ ACTIONS ────────────────────────────── */
    .req-actions { display:flex; gap:8px; margin-top:12px; }

    /* ── MODAL ───────────────────────────────────── */
    .modal-overlay {
      display:none; position:fixed; inset:0;
      background:rgba(0,0,0,0.5); z-index:200;
      align-items:flex-end; justify-content:center;
    }
    .modal-overlay.open { display:flex; }
    .modal {
      background:white; border-radius:24px 24px 0 0;
      padding:8px 18px 28px; width:100%; max-width:430px;
      max-height:88vh; overflow-y:auto;
    }
    .modal-handle { width:40px; height:4px; background:#DDD; border-radius:2px; margin:12px auto 18px; }
    .modal-title  { font-size:19px; font-weight:900; color:var(--purple); margin-bottom:16px; }

    /* ── TOAST ───────────────────────────────────── */
    .toast {
      position:fixed; bottom:24px;
      left:50%; transform:translateX(-50%) translateY(12px);
      background:#1F2937; color:white; padding:11px 20px;
      border-radius:25px; font-size:14px; font-weight:700;
      z-index:300; opacity:0; transition:all 0.28s;
      white-space:nowrap; pointer-events:none;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ── PROFILE AVATAR ──────────────────────────── */
    .avatar-wrap { text-align:center; padding:24px 16px 18px; }
    .avatar-emoji { font-size:72px; display:block; margin-bottom:8px; }
    .avatar-name  { font-size:22px; font-weight:900; color:var(--purple); }
    .avatar-sub   { color:var(--text-sub); font-size:13px; font-weight:600; margin-top:4px; }

    /* ════════════════════════════════════════════
       SETTINGS STYLES
    ════════════════════════════════════════════ */
    .sett-section-label {
      font-size:11px; font-weight:800;
      color:rgba(255,255,255,0.55);
      text-transform:uppercase; letter-spacing:.8px;
      margin:16px 0 6px; padding:0 2px;
    }
    .sett-row {
      display:flex; align-items:center; gap:12px;
      padding:13px 2px; cursor:pointer; transition:opacity .15s;
    }
    .sett-row:active { opacity:.7; }
    .sett-row + .sett-row { border-top:1px solid rgba(0,0,0,0.06); }
    .sett-icon  { font-size:20px; width:28px; text-align:center; flex-shrink:0; }
    .sett-info  { flex:1; }
    .sett-label { font-size:15px; font-weight:700; color:var(--text); }
    .sett-sub   { font-size:12px; color:var(--text-sub); margin-top:1px; }
    .sett-chev  { font-size:22px; color:#CCC; line-height:1; }

    /* Theme grid */
    .theme-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .theme-opt {
      border:3px solid transparent; border-radius:14px;
      cursor:pointer; padding:10px 6px; text-align:center;
      transition:all .2s; background:rgba(0,0,0,0.04);
    }
    .theme-opt.sel { border-color:var(--teal); }
    .theme-preview {
      height:44px; border-radius:9px; margin-bottom:8px;
      display:flex; align-items:center; justify-content:center; font-size:18px;
    }
    .theme-label { font-size:11px; font-weight:800; color:var(--text-sub); }

    /* Toggle */
    .toggle-row {
      display:flex; align-items:center; justify-content:space-between;
      padding:13px 2px;
    }
    .toggle-row + .toggle-row { border-top:1px solid rgba(0,0,0,0.06); }
    .toggle-lbl { font-size:15px; font-weight:700; color:var(--text); }
    .toggle-sub { font-size:12px; color:var(--text-sub); margin-top:1px; }
    .tog-track {
      width:44px; height:24px; border-radius:12px; background:#D0D0D0;
      position:relative; cursor:pointer; transition:background .2s; flex-shrink:0;
    }
    .tog-track.on { background:var(--teal); }
    .tog-thumb {
      position:absolute; width:20px; height:20px; background:white;
      border-radius:50%; top:2px; left:2px;
      transition:left .2s; box-shadow:0 1px 4px rgba(0,0,0,.25);
    }
    .tog-track.on .tog-thumb { left:22px; }

    /* Avatar picker grid */
    .av-grid { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:14px; }
    .av-opt {
      width:48px; height:48px; border-radius:12px; font-size:26px;
      display:flex; align-items:center; justify-content:center;
      border:3px solid transparent; cursor:pointer;
      background:rgba(0,0,0,0.05); transition:all .15s;
    }
    .av-opt.sel { border-color:var(--teal); background:var(--teal-light); }
    .av-opt:active { transform:scale(.9); }

    /* Add-friend rows */
    .af-row {
      display:flex; align-items:center; gap:12px;
      padding:11px 0; border-bottom:1px solid rgba(0,0,0,0.07);
    }
    .af-row:last-child { border-bottom:none; }
    .af-avatar {
      font-size:24px; width:42px; height:42px; flex-shrink:0;
      border-radius:11px; background:rgba(91,168,160,0.15);
      display:flex; align-items:center; justify-content:center;
    }
    .af-name   { font-weight:800; font-size:14px; color:var(--text); }
    .af-status { font-size:12px; color:var(--text-sub); margin-top:2px; }

    /* ── SUBSECTION TITLE ─────────────────────── */
    .subsection-title {
      font-size: 14px; font-weight: 800;
      color: var(--purple); margin-top: 16px; margin-bottom: 10px;
    }

    /* ════════════════════════════════════════════
       DARK THEME
    ════════════════════════════════════════════ */
    body[data-theme="dark"] {
      background: #0D0D1A;
    }
    body[data-theme="dark"] .header       { background:#1A1A30; box-shadow:0 2px 16px rgba(0,0,0,0.5); }
    body[data-theme="dark"] .logo-text    { background:linear-gradient(135deg,#A78BFA,#C084FC); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    body[data-theme="dark"] .tab-bar      { background:#111124; }
    body[data-theme="dark"] .tab-pill     { background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.4); }
    body[data-theme="dark"] .tab-pill.active { background:rgba(255,255,255,0.15); color:#fff; }
    body[data-theme="dark"] .card         { background:#1C1C35; border-color:rgba(255,255,255,0.06); }
    body[data-theme="dark"] .section-title { color:#A78BFA; text-shadow:none; }
    body[data-theme="dark"] .inner-tabs   { background:rgba(255,255,255,0.06); }
    body[data-theme="dark"] .inner-tab    { color:rgba(255,255,255,0.4); }
    body[data-theme="dark"] .inner-tab.active { background:rgba(255,255,255,0.1); color:#fff; }
    body[data-theme="dark"] .form-input   { background:#252545; color:#E8E8FF; border-color:rgba(255,255,255,0.12); }
    body[data-theme="dark"] .form-input:focus { border-color:var(--teal); }
    body[data-theme="dark"] .item-name    { color:#E8E8FF; }
    body[data-theme="dark"] .item-meta    { color:#7070A0; }
    body[data-theme="dark"] .info-row     { border-color:rgba(255,255,255,0.06); }
    body[data-theme="dark"] .info-label   { color:#7070A0; }
    body[data-theme="dark"] .info-value   { color:#BEBEFF; }
    body[data-theme="dark"] .divider      { background:rgba(255,255,255,0.07); }
    body[data-theme="dark"] .empty-state p { color:rgba(255,255,255,0.45); }
    body[data-theme="dark"] .avatar-name  { color:#A78BFA; }
    body[data-theme="dark"] .avatar-sub   { color:#7070A0; }

<!-- ════════ TOAST ════════ -->

<script>
// ──────────────────────────────────────────────
//  DATA
// ──────────────────────────────────────────────

const USERS = {
  alex:   { id:'alex',   name:'Alex',   emoji:'👦' },
  jordan: { id:'jordan', name:'Jordan', emoji:'👧' },
  sam:    { id:'sam',    name:'Sam',    emoji:'🧑' },
  riley:  { id:'riley',  name:'Riley',  emoji:'👱' },
  morgan: { id:'morgan', name:'Morgan', emoji:'🧔' },
  casey:  { id:'casey',  name:'Casey',  emoji:'🧕' },
};

// Use real current date/time
const NOW = new Date();

let currentUser = 'alex';

let friendships = {
  alex:   { friends:['jordan'], pendingIncoming:[], pendingOutgoing:[] },
  jordan: { friends:['alex'],   pendingIncoming:[], pendingOutgoing:[] },
  sam:    { friends:['riley'],  pendingIncoming:[], pendingOutgoing:[] },
  riley:  { friends:['sam'],    pendingIncoming:[], pendingOutgoing:[] },
  morgan: { friends:[],          pendingIncoming:[], pendingOutgoing:[] },
  casey:  { friends:[],          pendingIncoming:[], pendingOutgoing:[] },
};

let chats = {
  'alex-jordan': [
    { from:'jordan', text:'Hey, do you have a spare calculator?', time:'2:30 PM' },
    { from:'alex',   text:'Yeah! I have one you can borrow',      time:'2:32 PM' },
    { from:'jordan', text:'Great! Can I use it for a week?',      time:'2:33 PM' },
  ]
};

let transactions = [
  {
    id:1, itemId:1,
    borrower:'alex', lender:'jordan',
    itemName:'Noise-Cancelling Headphones', itemEmoji:'🎧',
    itemCondition:'Good', itemNotes:'Right ear-pad slightly worn',
    status:'active',
    requestedAt:'2026-06-08', startDate:'2026-06-09', dueDate:'2026-06-14',
    returnRequestAt:null, returnedAt:null,
    conditionRating:null, lenderNotes:'', borrowerNote:'Need it for finals week'
  },
  {
    id:2, itemId:2,
    borrower:'jordan', lender:'alex',
    itemName:'Ruler & Compass Set', itemEmoji:'📐',
    itemCondition:'Good', itemNotes:'',
    status:'returned',
    requestedAt:'2026-06-01', startDate:'2026-06-02', dueDate:'2026-06-07',
    returnRequestAt:'2026-06-06', returnedAt:'2026-06-07',
    conditionRating:5, lenderNotes:'Perfect condition, returned early!', borrowerNote:'Just for one project'
  }
];
let nextTxId = 3;

// ──────────────────────────────────────────────
//  SETTINGS STATE
// ──────────────────────────────────────────────

let currentTheme = 'orange';
let toggles = { borrowNotifs:true, returnReminders:true, friendRequests:true, lateAlerts:true };
let friendSearchQ = '';

const AVATAR_OPTIONS = [
  '👦','👧','🧑','👱','🧔','🧕','👴','👵','🧓',
  '👨‍💻','👩‍💻','🧑‍🎨','🧑‍🚀','👨‍🏫','👩‍🏫','🧑‍🎤',
  '🦸','🦹','🧙','🐱','🐶','🦊','🐺','🐻','🐼','🦁',
];

const ITEM_EMOJIS = [
  '📦','📚','🎧','💻','📱','⌚','🎮','🎸','🎹',
  '📷','🎬','🎨','✏️','🖊️','📐','📏','🔧','🔨',
  '👟','👕','🧥','🎒','👜','💼','⛱️','🎾','🏀',
];

// Borrow form state
let borrowFormState = {
  itemName: '',
  itemEmoji: '📦',
  itemCondition: 'Good',
  dueDate: '',
  borrowerNote: '',
  targetFriend: null
};

// ──────────────────────────────────────────────
//  HELPERS
// ──────────────────────────────────────────────

const $ = id => document.getElementById(id);

function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2800);
}

function closeModal(id) { $(id).classList.remove('open'); }
function openModal(id)  { $(id).classList.add('open');    }

document.querySelectorAll('.modal-overlay').forEach(o =>
  o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open'); })
);

function fmt(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}

function fmtTime(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit' });
}

function dueChip(dueDateStr) {
  const due  = new Date(dueDateStr + 'T23:59:59');
  const diff = Math.ceil((due - NOW) / 864e5);
  if (diff < 0)   return `<span class="due-chip due-over">🔴 ${Math.abs(diff)}d overdue</span>`;
  if (diff === 0) return `<span class="due-chip due-soon">⚠️ Due today</span>`;
  if (diff <= 3)  return `<span class="due-chip due-soon">⚡ ${diff}d left</span>`;
  return              `<span class="due-chip due-ok">📅 ${diff}d left</span>`;
}

function isLate(tx) {
  const due = new Date(tx.dueDate + 'T23:59:59');
  if (!tx.returnRequestAt) return NOW > due;
  return new Date(tx.returnRequestAt + 'T23:59:59') > due;
}

function getTx(id)   { return transactions.find(t => t.id === id); }

function pendingCount(userId) {
  return transactions.filter(tx =>
    tx.lender === userId &&
    (tx.status === 'requested' || tx.status === 'pending_return')
  ).length;
}

function pendingFriendRequests(userId) {
  return (friendships[userId] || { pendingIncoming:[] }).pendingIncoming.length;
}

function updateBadges() {
  const n  = pendingCount(currentUser);
  const el = $('req-badge');
  el.textContent = n;
  el.style.display = n > 0 ? 'inline-flex' : 'none';

  const fr  = pendingFriendRequests(currentUser);
  const el2 = $('friend-req-badge');
  el2.textContent = fr;
  el2.style.display = fr > 0 ? 'inline-flex' : 'none';
}

function emptyState(icon, msg) {
  return `<div class="empty-state"><div class="empty-icon">${icon}</div><p>${msg}</p></div>`;
}

function updateFABVisibility() {
  const fab = $('fab-borrow');
  if (currentScreen === 'borrows' || currentScreen === 'requests') {
    fab.classList.remove('hidden');
  } else {
    fab.classList.add('hidden');
  }
}

// ──────────────────────────────────────────────
//  NAVIGATION
// ──────────────────────────────────────────────

let currentScreen = 'friends';

function navigate(screen) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-pill').forEach(n => n.classList.remove('active'));
  $('screen-' + screen).classList.add('active');
  $('nav-'    + screen).classList.add('active');
  currentScreen = screen;
  render(screen);
  updateFABVisibility();
}

function render(screen) {
  if (screen === 'friends')  renderFriends();
  if (screen === 'borrows')  renderBorrows();
  if (screen === 'requests') renderRequests();
  if (screen === 'profile')  renderProfile();
  if (screen === 'settings') renderSettings();
  updateBadges();
}

function switchUser(uid) {
  currentUser = uid;
  updateUserSwitcher();
  render(currentScreen);
}

function updateUserSwitcher() {
  document.querySelectorAll('.user-btn').forEach(b => b.classList.remove('active'));
  $('switcher-' + currentUser).classList.add('active');
}

// ──────────────────────────────────────────────
//  FRIENDS SCREEN
// ──────────────────────────────────────────────

let friendsTab = 'my-friends';
let currentChatFriend = null;

function switchFriendsTab(tab) {
  friendsTab = tab;
  $('tab-my-friends').classList.toggle('active', tab==='my-friends');
  $('tab-pending-req').classList.toggle('active', tab==='pending-req');
  $('friends-my-friends').style.display  = tab==='my-friends'  ? 'block':'none';
  $('friends-pending-req').style.display = tab==='pending-req' ? 'block':'none';
}

function renderFriends() {
  const fs = friendships[currentUser];
  const myFriends      = (fs.friends || []).map(id => USERS[id]).filter(Boolean);
  const pendingReqs    = (fs.pendingIncoming || []).map(id => USERS[id]).filter(Boolean);

  $('friends-my-friends').innerHTML = myFriends.length
    ? myFriends.map(friend => `
        <div class="card">
          <div class="friend-row">
            <div class="friend-avatar">${friend.emoji}</div>
            <div class="friend-info">
              <div class="friend-name">${friend.name}</div>
              <div class="friend-status">✅ Friend</div>
            </div>
            <button class="btn btn-sm btn-primary" onclick="openChat('${friend.id}')">💬 Chat</button>
          </div>
        </div>`).join('')
    : emptyState('😔', 'No friends yet. Add some in Settings!');

  $('friends-pending-req').innerHTML = pendingReqs.length
    ? pendingReqs.map(friend => `
        <div class="card">
          <div class="friend-row">
            <div class="friend-avatar">${friend.emoji}</div>
            <div class="friend-info">
              <div class="friend-name">${friend.name}</div>
              <div class="friend-status">⏳ Wants to be friends</div>
            </div>
          </div>
          <div style="display:flex;gap:8px;margin-top:10px">
            <button class="btn btn-danger btn-sm" style="flex:1" onclick="respondFriendRequest('${friend.id}',false)">✕ Deny</button>
            <button class="btn btn-success btn-sm" style="flex:2" onclick="respondFriendRequest('${friend.id}',true)">✓ Accept</button>
          </div>
        </div>`).join('')
    : emptyState('🎉', 'No pending requests!');
}

function respondFriendRequest(userId, accept) {
  const fs = friendships[currentUser];
  const idx = fs.pendingIncoming.indexOf(userId);
  if (idx === -1) return;
  fs.pendingIncoming.splice(idx, 1);

  if (accept) {
    fs.friends.push(userId);
    const other = friendships[userId];
    if (other) {
      const idx2 = other.pendingOutgoing.indexOf(currentUser);
      if (idx2 !== -1) other.pendingOutgoing.splice(idx2, 1);
      if (!other.friends.includes(currentUser)) other.friends.push(currentUser);
    }
    toast(`✅ You're now friends with ${USERS[userId].name}!`);
  } else {
    const other = friendships[userId];
    if (other) {
      const idx2 = other.pendingOutgoing.indexOf(currentUser);
      if (idx2 !== -1) other.pendingOutgoing.splice(idx2, 1);
    }
    toast('✕ Friend request declined');
  }
  renderFriends();
  updateBadges();
}

// ──────────────────────────────────────────────
//  CHAT
// ──────────────────────────────────────────────

function openChat(friendId) {
  currentChatFriend = friendId;
  const key = [currentUser, friendId].sort().join('-');
  if (!chats[key]) chats[key] = [];

  $('chat-friend-name').textContent = `💬 ${USERS[friendId].name}`;
  renderChatMessages(key);
  $('chat-input-field').value = '';
  $('chat-input-field').focus();
  openModal('modal-chat');
}

function renderChatMessages(key) {
  const msgEl = $('chat-messages');
  msgEl.innerHTML = (chats[key] || []).map(msg => `
    <div class="message ${msg.from === currentUser ? 'sent' : 'received'}">
      <div class="msg-bubble">${msg.text}</div>
    </div>`).join('');
  msgEl.scrollTop = msgEl.scrollHeight;
}

function sendMessage() {
  const input = $('chat-input-field');
  const text  = input.value.trim();
  if (!text) return;
  const key = [currentUser, currentChatFriend].sort().join('-');
  if (!chats[key]) chats[key] = [];
  chats[key].push({ from:currentUser, text, time:new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}) });
  input.value = '';
  renderChatMessages(key);
}

function requestBorrowFromChat() {
  if (!currentChatFriend) return;
  borrowFormState.targetFriend = currentChatFriend;
  closeModal('modal-chat');
  openBorrowModal();
}

$('chat-input-field').addEventListener('keydown', e => { if (e.key==='Enter') sendMessage(); });

// ──────────────────────────────────────────────
//  BORROW REQUEST MODAL
// ──────────────────────────────────────────────

function openBorrowModal(targetFriend = null) {
  if (targetFriend) {
    borrowFormState.targetFriend = targetFriend;
  }
  
  const friendOptions = friendships[currentUser].friends
    .map(id => `<option value="${id}">${USERS[id].name}</option>`)
    .join('');
  
  if (!friendOptions) {
    toast('You need to add friends first!');
    return;
  }

  const emojiGrid = ITEM_EMOJIS.map(emoji => 
    `<button type="button" class="emoji-opt ${borrowFormState.itemEmoji === emoji ? 'sel' : ''}" onclick="selectItemEmoji('${emoji}')">${emoji}</button>`
  ).join('');

  const minDate = new Date(NOW);
  minDate.setDate(minDate.getDate() + 1);
  const minDateStr = minDate.toISOString().split('T')[0];

  $('modal-borrow-body').innerHTML = `
    <div class="form-group">
      <label class="form-label">👥 Borrowing from</label>
      <select id="borrow-friend" class="form-input" style="width:100%;padding:11px 14px;border:1.5px solid rgba(0,0,0,0.12);border-radius:12px;font-size:15px;font-family:inherit;color:var(--text)">
        <option value="">Select a friend...</option>
        ${friendOptions}
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">📦 Item name</label>
      <input type="text" id="borrow-item-name" class="form-input" placeholder="e.g. Calculator, Headphones..." value="${borrowFormState.itemName}">
    </div>
    <div class="form-group">
      <label class="form-label">📸 Item emoji</label>
      <div class="emoji-grid">${emojiGrid}</div>
    </div>
    <div class="form-group">
      <label class="form-label">📋 Item condition</label>
      <select id="borrow-condition" class="form-input" style="width:100%;padding:11px 14px;border:1.5px solid rgba(0,0,0,0.12);border-radius:12px;font-size:15px;font-family:inherit;color:var(--text)">
        <option value="Like New">Like New</option>
        <option value="Good" selected>Good</option>
        <option value="Fair">Fair</option>
        <option value="Used">Used</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">📅 Return date (required)</label>
      <input type="date" id="borrow-due-date" class="form-input" value="${borrowFormState.dueDate}" min="${minDateStr}">
    </div>
    <div class="form-group">
      <label class="form-label">📝 Note (optional)</label>
      <input type="text" id="borrow-note" class="form-input" placeholder="e.g. Need it for finals week" value="${borrowFormState.borrowerNote}">
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-ghost" style="flex:1;border-radius:25px" onclick="closeBorrowModal()">Cancel</button>
      <button class="btn btn-primary" style="flex:2" onclick="submitBorrowRequest()">📦 Send Request</button>
    </div>`;
  openModal('modal-borrow');
}

function selectItemEmoji(emoji) {
  borrowFormState.itemEmoji = emoji;
  document.querySelectorAll('.emoji-opt').forEach(el => el.classList.remove('sel'));
  event.target.classList.add('sel');
}

function closeBorrowModal() {
  closeModal('modal-borrow');
}

function submitBorrowRequest() {
  const friendId = $('borrow-friend').value;
  const itemName = $('borrow-item-name').value.trim();
  const dueDate = $('borrow-due-date').value;

  if (!friendId || !itemName || !dueDate) {
    toast('❌ Please fill all required fields');
    return;
  }

  const tx = {
    id: nextTxId++,
    itemId: nextTxId,
    borrower: currentUser,
    lender: friendId,
    itemName: itemName,
    itemEmoji: borrowFormState.itemEmoji,
    itemCondition: $('borrow-condition').value,
    itemNotes: '',
    status: 'requested',
    requestedAt: NOW.toISOString().split('T')[0],
    startDate: null,
    dueDate: dueDate,
    returnRequestAt: null,
    returnedAt: null,
    conditionRating: null,
    lenderNotes: '',
    borrowerNote: $('borrow-note').value.trim()
  };

  transactions.push(tx);
  toast(`✅ Borrow request sent to ${USERS[friendId].name}!`);
  closeModal('modal-borrow');
  borrowFormState = { itemName: '', itemEmoji: '📦', itemCondition: 'Good', dueDate: '', borrowerNote: '', targetFriend: null };
  renderBorrows();
  updateBadges();
}

// ──────────────────────────────────────────────
//  BORROWS SCREEN
// ──────────────────────────────────────────────

let borrowTab = 'borrowed';

function switchBorrowTab(tab) {
  borrowTab = tab;
  $('tab-borrowed').classList.toggle('active', tab==='borrowed');
  $('tab-lent').classList.toggle('active', tab==='lent');
  $('tab-history').classList.toggle('active', tab==='history');
  $('borrows-borrowed').style.display = tab==='borrowed' ? 'block':'none';
  $('borrows-lent').style.display = tab==='lent' ? 'block':'none';
  $('borrows-history').style.display = tab==='history' ? 'block':'none';
}

function renderBorrows() {
  const borrowed = transactions.filter(tx => tx.borrower === currentUser && (tx.status === 'active' || tx.status === 'requested'));
  const lent = transactions.filter(tx => tx.lender === currentUser && (tx.status === 'active' || tx.status === 'pending_return'));
  const history = transactions.filter(tx => (tx.borrower === currentUser || tx.lender === currentUser) && (tx.status === 'returned' || tx.status === 'lost'));

  $('borrows-borrowed').innerHTML = borrowed.length
    ? borrowed.map(tx => `
        <div class="card" onclick="openTransactionDetails(${tx.id})">
          <div class="item-row">
            <div class="item-emoji">${tx.itemEmoji}</div>
            <div style="flex:1">
              <div class="item-name">${tx.itemName}</div>
              <div class="item-meta">from ${USERS[tx.lender].name}</div>
            </div>
            <div class="badge b-${tx.status}">${tx.status === 'requested' ? '⏳ Pending' : '✓ Active'}</div>
          </div>
          <div style="margin-top:10px">${dueChip(tx.dueDate)}</div>
        </div>`).join('')
    : emptyState('📭', 'No borrowed items');

  $('borrows-lent').innerHTML = lent.length
    ? lent.map(tx => `
        <div class="card" onclick="openTransactionDetails(${tx.id})">
          <div class="item-row">
            <div class="item-emoji">${tx.itemEmoji}</div>
            <div style="flex:1">
              <div class="item-name">${tx.itemName}</div>
              <div class="item-meta">to ${USERS[tx.borrower].name}</div>
            </div>
            <div class="badge b-${tx.status}">${tx.status === 'pending_return' ? '🔄 Return Pending' : '✓ Active'}</div>
          </div>
          <div style="margin-top:10px">${dueChip(tx.dueDate)}</div>
        </div>`).join('')
    : emptyState('🎁', 'No lent items');

  $('borrows-history').innerHTML = history.length
    ? history.map(tx => `
        <div class="card" onclick="openTransactionDetails(${tx.id})">
          <div class="item-row">
            <div class="item-emoji">${tx.itemEmoji}</div>
            <div style="flex:1">
              <div class="item-name">${tx.itemName}</div>
              <div class="item-meta">${tx.borrower === currentUser ? 'from' : 'to'} ${tx.borrower === currentUser ? USERS[tx.lender].name : USERS[tx.borrower].name}</div>
            </div>
            <div class="badge b-${tx.status}">${tx.status === 'returned' ? '✓ Returned' : '❌ Lost'}</div>
          </div>
          <div style="margin-top:10px">Returned ${fmt(tx.returnedAt)}</div>
        </div>`).join('')
    : emptyState('📜', 'No history');
}

// ──────────────────────────────────────────────
//  TRANSACTION DETAILS MODAL
// ──────────────────────────────────────────────

function openTransactionDetails(txId) {
  const tx = getTx(txId);
  if (!tx) return;

  const isOwner = currentUser === tx.borrower;
  const otherUser = isOwner ? tx.lender : tx.borrower;
  const otherUserName = USERS[otherUser].name;

  let detailsHTML = `
    <div class="card" style="margin-bottom:14px">
      <div class="item-row" style="margin-bottom:14px">
        <div class="item-emoji" style="font-size:48px;width:60px;height:60px">${tx.itemEmoji}</div>
        <div style="flex:1">
          <div class="item-name">${tx.itemName}</div>
          <div class="item-meta" style="font-size:13px;color:var(--text-sub)">${isOwner ? 'Borrowed from' : 'Lent to'} ${otherUserName}</div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="info-row">
        <span class="info-label">Status</span>
        <span class="badge b-${tx.status}">${
          tx.status === 'requested' ? '⏳ Pending Approval' :
          tx.status === 'active' ? '✓ Active' :
          tx.status === 'pending_return' ? '🔄 Return Pending' :
          tx.status === 'returned' ? '✓ Returned' : '❌ Lost'
        }</span>
      </div>
      <div class="info-row">
        <span class="info-label">Condition</span>
        <span class="info-value">${tx.itemCondition}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Due Date</span>
        <span class="info-value">${fmt(tx.dueDate)}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Requested</span>
        <span class="info-value">${fmt(tx.requestedAt)}</span>
      </div>
      ${tx.startDate ? `<div class="info-row"><span class="info-label">Started</span><span class="info-value">${fmt(tx.startDate)}</span></div>` : ''}
      ${tx.returnedAt ? `<div class="info-row"><span class="info-label">Returned</span><span class="info-value">${fmt(tx.returnedAt)}</span></div>` : ''}
      ${tx.borrowerNote ? `<div class="info-row"><span class="info-label">Borrower Note</span><span class="info-value">${tx.borrowerNote}</span></div>` : ''}
      ${tx.lenderNotes ? `<div class="info-row"><span class="info-label">Lender Note</span><span class="info-value">${tx.lenderNotes}</span></div>` : ''}
    </div>
  `;

  // Action buttons based on status and role
  if (tx.status === 'requested' && !isOwner) {
    detailsHTML += `
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn btn-danger" style="flex:1" onclick="rejectBorrowRequest(${txId})">✕ Reject</button>
        <button class="btn btn-success" style="flex:1" onclick="approveBorrowRequest(${txId})">✓ Approve</button>
      </div>`;
  } else if (tx.status === 'active' && isOwner) {
    detailsHTML += `
      <div style="margin-top:12px">
        <button class="btn btn-primary btn-full" onclick="openReturnModal(${txId})">🔄 Request Return</button>
      </div>`;
  } else if (tx.status === 'pending_return' && !isOwner) {
    detailsHTML += `
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn btn-danger" style="flex:1" onclick="denyReturn(${txId})">✕ Deny Return</button>
        <button class="btn btn-success" style="flex:1" onclick="confirmReturn(${txId})">✓ Confirm Return</button>
      </div>`;
  }

  $('details-title').textContent = tx.itemName + ' 📋';
  $('modal-details-body').innerHTML = detailsHTML;
  openModal('modal-details');
}

function approveBorrowRequest(txId) {
  const tx = getTx(txId);
  if (!tx) return;
  tx.status = 'active';
  tx.startDate = NOW.toISOString().split('T')[0];
  toast('✅ Borrow approved!');
  closeModal('modal-details');
  renderBorrows();
  renderRequests();
  updateBadges();
}

function rejectBorrowRequest(txId) {
  const tx = getTx(txId);
  if (!tx) return;
  tx.status = 'returned';
  tx.returnedAt = NOW.toISOString().split('T')[0];
  toast('✕ Borrow rejected');
  closeModal('modal-details');
  renderBorrows();
  renderRequests();
  updateBadges();
}

function openReturnModal(txId) {
  const tx = getTx(txId);
  if (!tx) return;
  
  $('modal-return-body').innerHTML = `
    <div class="form-group">
      <label class="form-label">📋 Current condition</label>
      <select id="return-condition" class="form-input">
        <option value="Like New">Like New</option>
        <option value="Good" selected>Good</option>
        <option value="Fair">Fair</option>
        <option value="Used">Used</option>
        <option value="Damaged">Damaged</option>
        <option value="Lost">Lost</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">⭐ Condition rating (1-5)</label>
      <div class="star-row" id="star-rating">
        <span class="star" onclick="setRating(1)">⭐</span>
        <span class="star" onclick="setRating(2)">⭐</span>
        <span class="star" onclick="setRating(3)">⭐</span>
        <span class="star" onclick="setRating(4)">⭐</span>
        <span class="star" onclick="setRating(5)">⭐</span>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">📝 Notes</label>
      <input type="text" id="return-notes" class="form-input" placeholder="Any damages or notes?" value="">
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-ghost" style="flex:1" onclick="closeModal('modal-return')">Cancel</button>
      <button class="btn btn-primary" style="flex:1" onclick="submitReturn(${txId})">📦 Request Return</button>
    </div>`;
  
  window.currentReturnRating = 5;
  updateStarRating();
  closeModal('modal-details');
  openModal('modal-return');
}

window.currentReturnRating = 5;

function setRating(n) {
  window.currentReturnRating = n;
  updateStarRating();
}

function updateStarRating() {
  const stars = document.querySelectorAll('.star-row .star');
  stars.forEach((star, idx) => {
    if (idx < window.currentReturnRating) {
      star.classList.add('lit');
    } else {
      star.classList.remove('lit');
    }
  });
}

function submitReturn(txId) {
  const tx = getTx(txId);
  if (!tx) return;
  
  tx.status = 'pending_return';
  tx.returnRequestAt = NOW.toISOString().split('T')[0];
  tx.conditionRating = window.currentReturnRating;
  tx.lenderNotes = $('return-notes').value.trim();
  
  toast('✅ Return request sent!');
  closeModal('modal-return');
  renderBorrows();
  renderRequests();
  updateBadges();
}

function confirmReturn(txId) {
  const tx = getTx(txId);
  if (!tx) return;
  
  tx.status = 'returned';
  tx.returnedAt = NOW.toISOString().split('T')[0];
  
  toast('✅ Item confirmed returned!');
  closeModal('modal-details');
  renderBorrows();
  updateBadges();
}

function denyReturn(txId) {
  const tx = getTx(txId);
  if (!tx) return;
  
  tx.status = 'active';
  tx.returnRequestAt = null;
  tx.conditionRating = null;
  tx.lenderNotes = '';
  
  toast('✕ Return denied');
  closeModal('modal-details');
  renderBorrows();
  updateBadges();
}

// ──────────────────────────────────────────────
//  REQUESTS SCREEN
// ──────────────────────────────────────────────

function renderRequests() {
  const pending = transactions.filter(tx =>
    (tx.lender === currentUser && (tx.status === 'requested' || tx.status === 'pending_return'))
  );

  $('requests-list').innerHTML = pending.length
    ? pending.map(tx => {
        const isBorrowRequest = tx.status === 'requested';
        const type = isBorrowRequest ? '📦 Borrow Request' : '🔄 Return Request';
        return `
          <div class="card" onclick="openTransactionDetails(${tx.id})">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
              <div class="item-name">${type}</div>
              <div class="badge b-${tx.status}">${isBorrowRequest ? '⏳ Pending Approval' : '🔄 Return Pending'}</div>
            </div>
            <div class="item-row">
              <div class="item-emoji">${tx.itemEmoji}</div>
              <div style="flex:1">
                <div style="font-weight:700">${tx.itemName}</div>
                <div class="item-meta">from ${USERS[tx.borrower].name}</div>
              </div>
            </div>
            ${!isBorrowRequest ? `<div style="margin-top:8px;font-size:12px;color:var(--text-sub)">Condition: ${tx.itemCondition} | Rating: ${'⭐'.repeat(tx.conditionRating)}</div>` : ''}
          </div>`;
      }).join('')
    : emptyState('✨', 'No pending requests!');
}

// ──────────────────────────────────────────────
//  PROFILE SCREEN
// ──────────────────────────────────────────────

function renderProfile() {
  const user = USERS[currentUser];
  $('profile-content').innerHTML = `
    <div class="avatar-wrap">
      <span class="avatar-emoji">${user.emoji}</span>
      <div class="avatar-name">${user.name}</div>
      <div class="avatar-sub">Member since Jun 2026</div>
    </div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-number">${transactions.filter(tx => (tx.borrower === currentUser || tx.lender === currentUser) && tx.status !== 'returned').length}</div>
        <div class="stat-label">Active Items</div>
      </div>
      <div class="stat-card">
        <div class="stat-number">${transactions.filter(tx => tx.status === 'returned').length}</div>
        <div class="stat-label">Completed</div>
      </div>
    </div>
    <div class="divider"></div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn btn-primary btn-full" onclick="openNameModal()">✏️ Change Name</button>
    </div>
  `;
}

function openNameModal() {
  const user = USERS[currentUser];
  $('modal-name-body').innerHTML = `
    <div class="form-group">
      <label class="form-label">Display Name</label>
      <input type="text" id="name-input" class="form-input" value="${user.name}" placeholder="Your name">
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-ghost" style="flex:1" onclick="closeModal('modal-name')">Cancel</button>
      <button class="btn btn-primary" style="flex:1" onclick="submitNameChange()">✓ Save</button>
    </div>`;
  openModal('modal-name');
}

function submitNameChange() {
  const newName = $('name-input').value.trim();
  if (!newName) {
    toast('❌ Name cannot be empty');
    return;
  }
  USERS[currentUser].name = newName;
  toast('✅ Name updated!');
  closeModal('modal-name');
  renderProfile();
}

// ──────────────────────────────────────────────
//  SETTINGS SCREEN
// ──────────────────────────────────────────────

function renderSettings() {
  const themeOptions = [
    { id:'orange', name:'Orange', colors:'linear-gradient(135deg, #FFAA6B, #FF5C5C)' },
    { id:'purple', name:'Purple', colors:'linear-gradient(135deg, #A78BFA, #C084FC)' },
    { id:'teal',   name:'Teal',   colors:'linear-gradient(135deg, #5BA8A0, #4A9490)' },
  ];

  $('settings-content').innerHTML = `
    <div style="margin-bottom:24px">
      <div class="sett-section-label">📱 Theme</div>
      <div class="theme-grid">
        ${themeOptions.map(t => `
          <div class="theme-opt ${currentTheme === t.id ? 'sel' : ''}" onclick="changeTheme('${t.id}')">
            <div class="theme-preview" style="background:${t.colors}"></div>
            <div class="theme-label">${t.name}</div>
          </div>`).join('')}
      </div>
    </div>

    <div>
      <div class="sett-section-label">🔔 Notifications</div>
      <div class="toggle-row">
        <div>
          <div class="toggle-lbl">Borrow Notifications</div>
          <div class="toggle-sub">New borrow requests</div>
        </div>
        <div class="tog-track ${toggles.borrowNotifs ? 'on' : ''}" onclick="toggleSetting('borrowNotifs')">
          <div class="tog-thumb"></div>
        </div>
      </div>
      <div class="toggle-row">
        <div>
          <div class="toggle-lbl">Return Reminders</div>
          <div class="toggle-sub">Due date approaching</div>
        </div>
        <div class="tog-track ${toggles.returnReminders ? 'on' : ''}" onclick="toggleSetting('returnReminders')">
          <div class="tog-thumb"></div>
        </div>
      </div>
      <div class="toggle-row">
        <div>
          <div class="toggle-lbl">Late Alerts</div>
          <div class="toggle-sub">Items overdue</div>
        </div>
        <div class="tog-track ${toggles.lateAlerts ? 'on' : ''}" onclick="toggleSetting('lateAlerts')">
          <div class="tog-thumb"></div>
        </div>
      </div>
    </div>
  `;
}

function changeTheme(theme) {
  currentTheme = theme;
  document.querySelectorAll('.theme-opt').forEach(el => el.classList.remove('sel'));
  event.target.closest('.theme-opt').classList.add('sel');
}

function toggleSetting(key) {
  toggles[key] = !toggles[key];
  renderSettings();
}

// Initialize on page load
window.addEventListener('DOMContentLoaded', () => {
  render('friends');
});
</script>
</body>
</html>
