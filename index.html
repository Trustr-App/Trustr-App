<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trustr</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

    :root {
      --grad-top:    #FFAA6B;
      --grad-bot:    #FF5C5C;
      --teal:        #5BA8A0;
      --teal-dark:   #4A9490;
      --teal-light:  #E0F2F1;
      --purple:      #3C0060;
      --purple-mid:  #6B0FA0;
      --danger:      #D93030;
      --danger-light:#FDEAEA;
      --success:     #2E9E6B;
      --success-light:#E0F5EC;
      --warning:     #C97A00;
      --warning-light:#FFF3DC;
      --card:        #F0EEEE;
      --card-border: rgba(0,0,0,0.07);
      --text:        #111111;
      --text-sub:    #555;
      --hdr-h:       64px;
      --tab-h:       48px;
    }

    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(170deg, var(--grad-top) 0%, var(--grad-bot) 100%);
      background-attachment: fixed;
      color: var(--text);
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
    }

    /* ── AUTH SCREEN ─────────────────────────────── */
    #auth-screen {
      position: fixed; inset: 0;
      background: linear-gradient(170deg, var(--grad-top) 0%, var(--grad-bot) 100%);
      z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px 16px; overflow-y: auto;
    }
    #auth-screen.hidden { display: none; }
    .auth-card {
      background: white; border-radius: 24px;
      padding: 28px 22px; width: 100%; max-width: 390px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }
    .auth-logo { text-align: center; margin-bottom: 22px; }
    .auth-shield {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #FF8C00, #FF4444);
      border-radius: 18px; display: flex; align-items: center;
      justify-content: center; margin: 0 auto 12px;
      box-shadow: 0 4px 16px rgba(255,100,0,0.35);
    }
    .auth-logo-text {
      font-size: 26px; font-weight: 900; letter-spacing: 1px;
      background: linear-gradient(135deg, var(--purple), var(--purple-mid));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .auth-tabs {
      display: flex; background: #F0F0F0; border-radius: 12px;
      padding: 3px; margin-bottom: 20px;
    }
    .auth-tab {
      flex: 1; padding: 9px; text-align: center; border: none;
      background: transparent; border-radius: 9px;
      font-size: 14px; font-weight: 700; cursor: pointer;
      transition: all 0.2s; font-family: inherit; color: #888;
    }
    .auth-tab.active { background: white; color: var(--purple); box-shadow: 0 1px 4px rgba(0,0,0,0.12); }
    .test-box {
      background: rgba(91,168,160,0.08); border: 1.5px solid rgba(91,168,160,0.25);
      border-radius: 12px; padding: 12px; margin-bottom: 16px;
    }
    .test-box-label { font-size:11px; font-weight:800; color:var(--teal); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
    .test-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 12px; border-radius: 20px; border: none;
      background: rgba(91,168,160,0.15); color: var(--teal-dark);
      font-size: 13px; font-weight: 700; cursor: pointer;
      margin: 3px; font-family: inherit; transition: all 0.15s;
    }
    .test-btn:active { opacity: 0.7; transform: scale(0.95); }
    .test-hint { font-size: 11px; color: var(--text-sub); margin-top: 7px; }
    .av-signup-grid { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .av-signup-opt {
      width: 42px; height: 42px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      border: 2.5px solid transparent; cursor: pointer;
      background: rgba(0,0,0,0.04); transition: all .15s;
    }
    .av-signup-opt.sel { border-color: var(--teal); background: var(--teal-light); }

    /* ── HEADER ─────────────────────────────────── */
    .header {
      position: fixed; top: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px; height: var(--hdr-h);
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    }
    .logo-wrap { display:flex; align-items:center; gap:8px; }
    .logo-shield {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #FF8C00, #FF4444);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 6px rgba(255,100,0,0.35);
    }
    .logo-text {
      font-size: 20px; font-weight: 900; letter-spacing: 1px;
      background: linear-gradient(135deg, var(--purple) 0%, var(--purple-mid) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header-right { display:flex; align-items:center; gap:8px; }
    #header-user-display { font-size:13px; font-weight:800; color:var(--text); }
    .logout-btn {
      padding: 5px 11px; border-radius: 14px; border: none;
      background: #F0F0F0; color: #777; font-size: 12px;
      font-weight: 700; cursor: pointer; font-family: inherit; transition: all .15s;
    }
    .logout-btn:active { opacity: .7; }

    /* ── TAB BAR ─────────────────────────────────── */
    .tab-bar {
      position: fixed; top: var(--hdr-h); left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px; height: var(--tab-h);
      background: rgba(200,190,190,0.55); backdrop-filter: blur(6px);
      display: flex; align-items: center;
      padding: 6px 10px; gap: 6px; z-index: 99; overflow-x: auto; scrollbar-width: none;
    }
    .tab-bar::-webkit-scrollbar { display:none; }
    .tab-pill {
      flex-shrink: 0; padding: 6px 14px; border-radius: 20px; border: none;
      background: rgba(255,255,255,0.3); color: rgba(255,255,255,0.9);
      font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s; font-family: inherit;
      display:inline-flex; align-items:center; gap:6px;
    }
    .tab-pill.active { background: rgba(255,255,255,0.95); color: var(--purple); }
    .tab-pill .pill-badge {
      display:inline-flex; align-items:center; justify-content:center;
      background: var(--danger); color:white; font-size:10px; font-weight:800;
      width:16px; height:16px; border-radius:50%; margin-left:4px; vertical-align:middle;
    }

    /* ── CONTENT ─────────────────────────────────── */
    .content {
      padding-top: calc(var(--hdr-h) + var(--tab-h) + 16px);
      padding-bottom: 28px; padding-left: 14px; padding-right: 14px; min-height: 100vh;
    }
    .screen { display:none; }
    .screen.active { display:block; }
    .section-title {
      font-size: 19px; font-weight: 900; color: var(--purple); margin-bottom: 14px;
      text-shadow: 0 1px 2px rgba(255,255,255,0.4);
      display:flex; align-items:center; gap:8px;
    }
    .card {
      background: var(--card); border-radius: 16px; padding: 14px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.13); margin-bottom: 12px;
      border: 1px solid var(--card-border); cursor: pointer; transition: all 0.15s;
    }
    .card:active { transform: scale(0.98); opacity: 0.9; }

    /* ── STATUS BADGES ───────────────────────────── */
    .badge { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; }
    .b-requested      { background:var(--warning-light); color:var(--warning); }
    .b-active         { background:var(--success-light); color:var(--success); }
    .b-pending_return { background:var(--teal-light);    color:var(--teal-dark); }
    .b-returned       { background:#EBEBEB;              color:#555; }
    .b-late           { background:var(--danger-light);  color:var(--danger); }
    .b-lost           { background:#1F2937;              color:white; }

    /* ── BUTTONS ─────────────────────────────────── */
    .btn {
      padding: 11px 16px; border-radius: 25px; border: none;
      font-size: 14px; font-weight: 700; cursor: pointer;
      transition: all 0.15s; display:inline-flex; align-items:center;
      justify-content:center; gap:6px; font-family:inherit;
    }
    .btn:active { transform:scale(0.96); opacity:0.9; }
    .btn-primary { background:var(--teal);   color:white; }
    .btn-success { background:var(--teal);   color:white; }
    .btn-danger  { background:var(--danger); color:white; }
    .btn-outline { background:transparent; color:var(--teal); border:2px solid var(--teal); }
    .btn-ghost   { background:rgba(255,255,255,0.6); color:var(--text); }
    .btn-full    { width:100%; }
    .btn-sm      { padding:7px 14px; font-size:13px; }

    /* ── FAB ─────────────────────────────────────── */
    .fab {
      position:fixed; bottom:28px; right:calc(50% - 215px + 14px);
      width:56px; height:56px; border-radius:50%; border:none;
      background:linear-gradient(135deg, var(--teal), var(--teal-dark));
      color:white;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; z-index:90;
      box-shadow:0 4px 16px rgba(91,168,160,0.4); transition:all 0.2s;
    }
    .fab:active { transform:scale(0.9); }
    .fab.hidden { display:none; }

    /* ── FORM ────────────────────────────────────── */
    .form-group { margin-bottom:14px; }
    .form-label { font-size:12px; font-weight:700; color:var(--text-sub); margin-bottom:6px; display:block; text-transform:uppercase; letter-spacing:.4px; }
    .form-input {
      width:100%; padding:11px 14px; border:1.5px solid rgba(0,0,0,0.12); border-radius:12px;
      font-size:15px; outline:none; transition:border-color 0.2s; font-family:inherit; color:var(--text); background:white;
    }
    .form-input:focus { border-color:var(--teal); }
    .form-select {
      width:100%; padding:11px 14px; border:1.5px solid rgba(0,0,0,0.12); border-radius:12px;
      font-size:15px; outline:none; font-family:inherit; color:var(--text); background:white;
      appearance:none; cursor:pointer;
    }

    /* ── INNER TABS ─────────────────────────────── */
    .inner-tabs { display:flex; gap:0; margin-bottom:16px; background:rgba(0,0,0,0.12); border-radius:14px; padding:3px; }
    .inner-tab {
      flex:1; padding:8px; text-align:center; border:none; background:transparent; border-radius:11px;
      font-size:13px; font-weight:700; color:rgba(255,255,255,0.7); cursor:pointer; transition:all 0.2s; font-family:inherit;
    }
    .inner-tab.active { background:white; color:var(--purple); box-shadow:0 1px 4px rgba(0,0,0,0.15); }

    /* ── INFO ROWS ───────────────────────────────── */
    .info-row { display:flex; justify-content:space-between; align-items:center; padding:7px 0; font-size:13px; border-bottom:1px solid rgba(0,0,0,0.06); }
    .info-row:last-child { border-bottom:none; }
    .info-label { color:var(--text-sub); }
    .info-value { font-weight:700; text-align:right; max-width:60%; }
    .divider { height:1px; background:rgba(0,0,0,0.08); margin:12px 0; }
    .empty-state { text-align:center; padding:48px 24px; }
    .empty-icon { display:flex; justify-content:center; margin-bottom:12px; }
    .empty-state p { font-size:15px; font-weight:600; color:rgba(255,255,255,0.85); }

    /* ── ITEM ROW ────────────────────────────────── */
    .item-row { display:flex; align-items:center; gap:12px; }
    .item-icon {
      width:50px; height:50px; background:rgba(91,168,160,0.15);
      border-radius:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
    }
    .item-name { font-size:15px; font-weight:800; margin-bottom:2px; color:var(--text); }
    .item-meta { font-size:12px; color:var(--text-sub); margin-top:1px; }

    /* ── STATS ───────────────────────────────────── */
    .stats-grid  { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
    .stat-card   { border-radius:14px; padding:14px; text-align:center; background:var(--card); box-shadow:0 2px 8px rgba(0,0,0,0.1); }
    .stat-number { font-size:28px; font-weight:900; color:var(--purple); }
    .stat-label  { font-size:11px; color:var(--text-sub); margin-top:3px; font-weight:700; text-transform:uppercase; letter-spacing:.3px; }

    /* ── DUE CHIP ────────────────────────────────── */
    .due-chip { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:10px; }
    .due-ok   { background:var(--success-light); color:var(--success); }
    .due-soon { background:var(--warning-light);  color:var(--warning); }
    .due-over { background:var(--danger-light);   color:var(--danger); }

    /* ── FRIEND ROW ──────────────────────────────── */
    .friend-row { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid rgba(0,0,0,0.07); }
    .friend-row:last-child { border-bottom:none; }
    .friend-avatar { width:48px; height:48px; display:flex; align-items:center; justify-content:center; background:rgba(91,168,160,0.15); border-radius:12px; }
    .friend-info { flex:1; }
    .friend-name { font-weight:800; font-size:14px; color:var(--text); }
    .friend-status { font-size:12px; color:var(--text-sub); margin-top:2px; display:flex; align-items:center; gap:4px; }

    /* ── CHAT ────────────────────────────────────── */
    .chat-messages { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px; }
    .message { display:flex; gap:8px; margin-bottom:8px; }
    .message.sent { justify-content:flex-end; }
    .message.sent .msg-bubble { background:var(--teal); color:white; }
    .message.received .msg-bubble { background:#EBEBEB; color:var(--text); }
    .msg-bubble { max-width:75%; padding:10px 14px; border-radius:12px; font-size:13px; word-wrap:break-word; line-height:1.4; }
    .chat-input { padding:12px; border-top:1px solid rgba(0,0,0,0.1); display:flex; gap:8px; }
    .chat-input input { flex:1; padding:8px 12px; border:1px solid rgba(0,0,0,0.15); border-radius:20px; font-size:13px; font-family:inherit; outline:none; }
    .chat-input button { padding:8px 14px; background:var(--teal); color:white; border:none; border-radius:20px; cursor:pointer; font-weight:700; font-size:12px; font-family:inherit; }
    .chat-actions { display:flex; gap:8px; padding:12px; border-top:1px solid rgba(0,0,0,0.1); }
    .chat-actions button { flex:1; padding:8px 12px; background:var(--teal); color:white; border:none; border-radius:20px; cursor:pointer; font-weight:700; font-size:12px; font-family:inherit; display:inline-flex; align-items:center; justify-content:center; gap:6px; }

    /* ── EMOJI PICKER ────────────────────────────── */
    .icon-grid { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:14px; }
    .icon-opt {
      width:48px; height:48px; border-radius:12px;
      display:flex; align-items:center; justify-content:center;
      border:3px solid transparent; cursor:pointer; background:rgba(0,0,0,0.05); transition:all .15s;
    }
    .icon-opt.sel { border-color:var(--teal); background:var(--teal-light); }
    .icon-opt:active { transform:scale(.9); }

    /* ── STARS ───────────────────────────────────── */
    .star-row { display:flex; gap:5px; margin:6px 0 12px; }
    .star { cursor:pointer; opacity:0.25; transition:opacity 0.15s, transform 0.1s; user-select:none; display:inline-flex; }
    .star.lit { opacity:1; }
    .star:active { transform:scale(1.2); }

    .star-rating { position:relative; display:inline-block; line-height:1; font-size:20px; }
    .stars-outer { color:#E3E3E3; display:block; }
    .stars-inner { position:absolute; top:0; left:0; overflow:hidden; white-space:nowrap; color:#FFB400; width:0%; pointer-events:none; }
    .star-rating[aria-label] { vertical-align:middle; }

    /* ── REP BAR ─────────────────────────────────── */
    .rep-row { margin-bottom:12px; }
    .rep-header { display:flex; justify-content:space-between; font-size:13px; font-weight:700; margin-bottom:5px; }
    .rep-bar  { background:#E0E0E0; border-radius:8px; height:9px; overflow:hidden; }
    .rep-fill { height:100%; border-radius:8px; transition:width 0.6s ease; }

    /* ── MODAL ───────────────────────────────────── */
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:200; align-items:flex-end; justify-content:center; }
    .modal-overlay.open { display:flex; }
    .modal { background:white; border-radius:24px 24px 0 0; padding:8px 18px 28px; width:100%; max-width:430px; max-height:88vh; overflow-y:auto; }
    .modal-handle { width:40px; height:4px; background:#DDD; border-radius:2px; margin:12px auto 18px; }
    .modal-title  { font-size:19px; font-weight:900; color:var(--purple); margin-bottom:16px; display:flex; align-items:center; gap:8px; }

    /* ── TOAST ───────────────────────────────────── */
    .toast {
      position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(12px);
      background:#1F2937; color:white; padding:11px 20px; border-radius:25px;
      font-size:14px; font-weight:700; z-index:1000; opacity:0; transition:all 0.28s;
      white-space:nowrap; pointer-events:none;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ── PROFILE ─────────────────────────────────── */
    .avatar-wrap { text-align:center; padding:24px 16px 18px; }
    .avatar-icon { display:flex; justify-content:center; margin-bottom:8px; }
    .avatar-name  { font-size:22px; font-weight:900; color:var(--purple); }
    .avatar-sub   { color:var(--text-sub); font-size:13px; font-weight:600; margin-top:4px; }

    /* ── SETTINGS ────────────────────────────────── */
    .sett-section-label { font-size:11px; font-weight:800; color:rgba(255,255,255,0.55); text-transform:uppercase; letter-spacing:.8px; margin:16px 0 6px; padding:0 2px; }
    .theme-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .theme-opt { border:3px solid transparent; border-radius:14px; cursor:pointer; padding:10px 6px; text-align:center; transition:all .2s; background:rgba(0,0,0,0.04); }
    .theme-opt.sel { border-color:var(--teal); }
    .theme-preview { height:44px; border-radius:9px; margin-bottom:8px; display:flex; align-items:center; justify-content:center; }
    .theme-label { font-size:11px; font-weight:800; color:var(--text-sub); }
    .toggle-row { display:flex; align-items:center; justify-content:space-between; padding:13px 2px; }
    .toggle-row + .toggle-row { border-top:1px solid rgba(0,0,0,0.06); }
    .toggle-lbl { font-size:15px; font-weight:700; color:var(--text); }
    .toggle-sub { font-size:12px; color:var(--text-sub); margin-top:1px; }
    .tog-track { width:44px; height:24px; border-radius:12px; background:#D0D0D0; position:relative; cursor:pointer; transition:background .2s; flex-shrink:0; }
    .tog-track.on { background:var(--teal); }
    .tog-thumb { position:absolute; width:20px; height:20px; background:white; border-radius:50%; top:2px; left:2px; transition:left .2s; box-shadow:0 1px 4px rgba(0,0,0,.25); }
    .tog-track.on .tog-thumb { left:22px; }

    .af-row { display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid rgba(0,0,0,0.07); }
    .af-row:last-child { border-bottom:none; }
    .af-avatar { width:42px; height:42px; flex-shrink:0; border-radius:11px; background:rgba(91,168,160,0.15); display:flex; align-items:center; justify-content:center; }
    .af-name   { font-weight:800; font-size:14px; color:var(--text); }
    .af-status { font-size:12px; color:var(--text-sub); margin-top:2px; display:flex; align-items:center; gap:4px; }
    .av-grid { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:14px; }
    .av-opt { width:48px; height:48px; border-radius:12px; display:flex; align-items:center; justify-content:center; border:3px solid transparent; cursor:pointer; background:rgba(0,0,0,0.05); transition:all .15s; }
    .av-opt.sel { border-color:var(--teal); background:var(--teal-light); }
    .av-opt:active { transform:scale(.9); }

    /* DARK THEME */
    body[data-theme="dark"] { background:#0D0D1A; }
    body[data-theme="dark"] .header       { background:#1A1A30; box-shadow:0 2px 16px rgba(0,0,0,0.5); }
    body[data-theme="dark"] .logo-text    { background:linear-gradient(135deg,#A78BFA,#C084FC); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    body[data-theme="dark"] #header-user-display { color:#E8E8FF; }
    body[data-theme="dark"] .logout-btn   { background:#252545; color:#9090B8; }
    body[data-theme="dark"] .tab-bar      { background:#111124; }
    body[data-theme="dark"] .tab-pill     { background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.4); }
    body[data-theme="dark"] .tab-pill.active { background:rgba(255,255,255,0.15); color:#fff; }
    body[data-theme="dark"] .card         { background:#1C1C35; border-color:rgba(255,255,255,0.06); }
    body[data-theme="dark"] .section-title { color:#A78BFA; text-shadow:none; }
    body[data-theme="dark"] .inner-tabs   { background:rgba(255,255,255,0.06); }

<script>
const $ = id => document.getElementById(id);

function icon(name, cls='') {
  return `<i data-lucide="${name}"${cls ? ` class="${cls}"` : ''}></i>`;
}

function refreshIcons() {
  if (window.lucide && typeof lucide.createIcons === 'function') {
    lucide.createIcons();
  }
}

function parseDateLocal(d) {
  if (!d) return null;
  if (d instanceof Date) return d;
  const parts = d.split && d.split('-');
  if (parts && parts.length >= 3) {
    return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  }
  const dt = new Date(d);
  return isNaN(dt) ? null : dt;
}

function daysLate(tx) {
  const returned = parseDateLocal(tx.returnedAt || tx.returnRequestAt);
  const due = parseDateLocal(tx.dueDate);
  if (!returned || !due) return null;
  const msPerDay = 1000 * 60 * 60 * 24;
  const diff = Math.floor((returned - due) / msPerDay);
  return diff > 0 ? diff : 0;
}

function punctualityScore(tx) {
  if (tx.status === 'lost') return 0;
  const late = daysLate(tx);
  if (late === null) return 0;
  if (late === 0) return 50;
  if (late === 1) return 40;
  if (late >= 2 && late <= 3) return 30;
  if (late >= 4 && late <= 7) return 15;
  return 0;
}

function conditionScore(tx) {
  const r = tx.conditionRating;
  if (tx.status === 'lost') return 0;
  if (r == null) return tx.status === 'returned' ? 50 : 0;
  if (r >= 5) return 50;
  if (r === 4) return 40;
  if (r === 3) return 25;
  if (r === 2 || r === 1) return 10;
  return 0;
}

function computeTransactionScore(tx) {
  const p = punctualityScore(tx);
  const c = conditionScore(tx);
  const total = (p || 0) + (c || 0);
  const rawStars = total / 20;
  const roundedStars = Math.round(rawStars * 10) / 10;
  return { score100: total, stars: roundedStars, punctuality: p, condition: c, rawStars };
}

function userTransactionsAsBorrower(uid) {
  return transactions.filter(t => t.borrower === uid && (t.status === 'returned' || t.status === 'lost' || t.returnedAt));
}

function computeUserCredit(uid) {
  const txs = userTransactionsAsBorrower(uid);
  const total = txs.length;
  if (total === 0) {
    return {
      averageStars: 0.0,
      totalTx: 0,
      goodPct: 0,
      latePct: 0,
      lostPct: 0,
      notSameOrBetterPct: 0,
      details: { total:0, good:0, late:0, lost:0, worseCondition:0 },
      txs: []
    };
  }
  let sumStars = 0;
  let goodCount = 0;
  let lateCount = 0;
  let lostCount = 0;
  let worseCondCount = 0;
  const txDetails = txs.map(tx => {
    const s = tx.credit ? tx.credit : computeTransactionScore(tx);
    sumStars += s.stars;
    const isGood = s.stars >= 4.0;
    if (isGood) goodCount++;
    if ((s.punctuality || 0) < 50) lateCount++;
    if (s.condition === 0 || tx.status === 'lost') lostCount++;
    if (tx.conditionRating == null) {
      if (tx.status === 'lost') worseCondCount++;
    } else {
      if (tx.conditionRating < 5) worseCondCount++;
    }
    return Object.assign({}, tx, { credit: s });
  });
  const avg = Math.round((sumStars / total) * 10) / 10;
  const goodPct = Math.round((goodCount / total) * 100);
  const latePct = Math.round((lateCount / total) * 100);
  const lostPct = Math.round((lostCount / total) * 100);
  const notSameOrBetterPct = Math.round((worseCondCount / total) * 100);
  return {
    averageStars: avg,
    totalTx: total,
    goodPct,
    latePct,
    lostPct,
    notSameOrBetterPct,
    details: { total, good:goodCount, late:lateCount, lost:lostCount, worseCondition:worseCondCount },
    txs: txDetails
  };
}

function renderStarsHtml(value, size='18px') {
  value = Math.round((value || 0) * 10) / 10;
  const pct = (value / 5) * 100;
  return `<span class="star-rating" role="img" aria-label="${value.toFixed(1)} out of 5 stars" style="font-size:${size}">
            <span class="stars-outer">★★★★★</span>
            <span class="stars-inner" style="width:${pct}%">★★★★★</span>
          </span>`;
}

function fmt(ds) {
  if (!ds) return '—';
  return new Date(ds+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});

function dueChip(ds) {
  const due = new Date(ds+'T23:59:59');
  const diff = Math.ceil((due - NOW) / 864e5);
  if (diff<0)   return `<span class="due-chip due-over">${icon('circle-alert')} ${Math.abs(diff)}d overdue</span>`;
  if (diff===0) return `<span class="due-chip due-soon">${icon('triangle-alert')} Due today</span>`;
  if (diff<=3)  return `<span class="due-chip due-soon">${icon('zap')} ${diff}d left</span>`;
  return `<span class="due-chip due-ok">${icon('calendar-days')} ${diff}d left</span>`;
}

function isLate(tx) {
  const due = new Date(tx.dueDate+'T23:59:59');
  if (!tx.returnRequestAt) return NOW > due;
  return new Date(tx.returnRequestAt+'T23:59:59') > due;
}

      ${tx.conditionRating ? `<div class="info-row"><span class="info-label">Rating</span><span class="info-value">${renderStarsHtml(credit.stars,'16px')} ${credit.stars.toFixed(1)}</span></div>` : ''}

  if (tx.status==='requested' && !isBorrower) {

    </div>`;
  } else if (tx.status==='active' && isBorrower) {
    html += `<button class="btn btn-primary btn-full" onclick="openReturnModal(${txId})"><i data-lucide="rotate-ccw"></i> Request Return</button>`;
  } else if (tx.status==='pending_return' && !isBorrower) {
    lenderReturnRating=5;
    const tmpTx = Object.assign({}, tx);
    const punct = punctualityScore(tmpTx);
    const punctLabel = punct===50?'On time (50)': punct===40?'1d late (40)': punct===30?'2-3d late (30)': punct===15?'4-7d late (15)':'>7d late (0)';
    html += `
      <div class="card" style="cursor:default; background:var(--teal-light); border:1.5px solid var(--teal)">
        <div style="font-weight:900; margin-bottom:6px; display:flex; align-items:center; gap:6px">${icon('star')} Rate condition - 5 buttons</div>
        <div style="font-size:11px; color:var(--text-sub); margin-bottom:8px">Return auto: ${fmt(tx.returnRequestAt||tx.returnedAt)} • Punctuality auto: <strong>${punctLabel}</strong> • Score = Punctuality + Condition</div>
        <div style="display:grid; grid-template-columns:1fr; gap:6px; margin:10px 0">
          <button class="btn btn-ghost" id="cond-btn-5" style="justify-content:flex-start; border:2.5px solid var(--teal); background:white" onclick="setLenderRating(5)"><span style="width:28px; font-weight:900">5★</span> Same/Better Condition <span style="margin-left:auto; font-size:11px; opacity:0.7">50 pts</span></button>
          <button class="btn btn-ghost" id="cond-btn-4" style="justify-content:flex-start;" onclick="setLenderRating(4)"><span style="width:28px; font-weight:900">4★</span> Minor wear <span style="margin-left:auto; font-size:11px; opacity:0.7">40 pts</span></button>
          <button class="btn btn-ghost" id="cond-btn-3" style="justify-content:flex-start;" onclick="setLenderRating(3)"><span style="width:28px; font-weight:900">3★</span> Noticeable damage <span style="margin-left:auto; font-size:11px; opacity:0.7">25 pts</span></button>
          <button class="btn btn-ghost" id="cond-btn-2" style="justify-content:flex-start;" onclick="setLenderRating(2)"><span style="width:28px; font-weight:900">2★</span> Major damage <span style="margin-left:auto; font-size:11px; opacity:0.7">10 pts</span></button>
          <button class="btn btn-ghost" id="cond-btn-1" style="justify-content:flex-start;" onclick="setLenderRating(1)"><span style="width:28px; font-weight:900">1★</span> Lost / Missing <span style="margin-left:auto; font-size:11px; opacity:0.7">0 pts</span></button>
        </div>
        <div style="font-size:12px; font-weight:700; color:var(--text); margin-bottom:8px" id="lender-rating-label">Selected: 5★ Same/Better Condition (50 pts)</div>

        </div>

  }

  $('details-title').innerHTML = `${tx.itemName} ${icon('clipboard-list')}`;
  $('modal-details-body').innerHTML = html;
  openModal('modal-details');

function approveBorrowRequest(txId) {
  const tx = getTx(txId); if(!tx) return;
  tx.status = 'active'; tx.startDate = NOW.toISOString().split('T')[0];
  toast('Borrow approved!'); closeModal('modal-details');
  renderBorrows(); renderRequests(); updateBadges();
}

function rejectBorrowRequest(txId) {
  transactions = transactions.filter(t => t.id!==txId);
  toast('Request rejected'); closeModal('modal-details');
  renderBorrows(); renderRequests(); updateBadges();
}

window.currentReturnRating = 5;


let lenderReturnRating = 5;

function openReturnModal(txId) {
  const tx = getTx(txId); if(!tx) return;
  const autoDate = new Date().toISOString().split('T')[0];
  const tmpTx = Object.assign({}, tx, { returnedAt: autoDate, returnRequestAt: autoDate });
  const punct = punctualityScore(tmpTx);
  const punctLabel = punct===50?'On time (50 pts)': punct===40?'1d late (40 pts)': punct===30?'2-3d late (30 pts)': punct===15?'4-7d late (15 pts)':'>7d late (0 pts)';
  $('modal-return-body').innerHTML = `
    <div class="form-group" style="background:var(--teal-light); padding:10px; border-radius:10px; border:1px solid rgba(91,168,160,0.3)">
      <div style="font-size:12px; font-weight:800; color:var(--teal-dark); display:flex; align-items:center; gap:6px"><i data-lucide="calendar-days"></i> Return: auto (${autoDate})</div>
      <div style="font-size:11px; color:var(--text-sub); margin-top:4px">Due ${fmt(tx.dueDate)} • Punctuality auto: <strong>${punctLabel}</strong></div>
    </div>
    <div class="form-group"><label class="form-label"><i data-lucide="notebook-pen"></i> Notes to lender (optional)</label><input type="text" id="return-notes" class="form-input" placeholder="Any notes?"></div>
    <div style="display:flex;gap:10px"><button class="btn btn-ghost" style="flex:1" onclick="closeModal('modal-return')">Cancel</button><button class="btn btn-primary" style="flex:2" onclick="submitReturn(${txId})"><i data-lucide="package"></i> Send Return Request</button></div>`;
  closeModal('modal-details'); openModal('modal-return'); refreshIcons();
}

function submitReturn(txId) {
  const tx = getTx(txId); if(!tx) return;
  const autoDate = new Date().toISOString().split('T')[0];
  tx.status = 'pending_return';
  tx.returnRequestAt = autoDate;
  tx.returnedAt = autoDate;
  const note = ($('return-notes')?.value||'').trim();
  if(note){ tx.borrowerNote = tx.borrowerNote ? tx.borrowerNote + ' | Return: ' + note : note; }
  toast('Return request sent! Auto date ' + autoDate + ' - awaiting lender condition rating.'); 
  closeModal('modal-return');
  renderBorrows(); renderRequests(); updateBadges();
}

function setLenderRating(n){
  lenderReturnRating=n;
  for(let i=1;i<=5;i++){
    const btn = document.getElementById('cond-btn-'+i);
    if(!btn) continue;
    if(i===n){
      btn.style.borderColor='var(--teal)';
      btn.style.background='white';
      btn.style.borderWidth='2.5px';
      btn.classList.add('btn-success');
      btn.classList.remove('btn-ghost');
    } else {
      btn.style.borderColor='#DDD';
      btn.style.background='';
      btn.style.borderWidth='1.5px';
      btn.classList.remove('btn-success');
      btn.classList.add('btn-ghost');
    }
  }
  const labels={5:'5★ Same/Better Condition (50 pts)',4:'4★ Minor wear (40 pts)',3:'3★ Noticeable damage (25 pts)',2:'2★ Major damage (10 pts)',1:'1★ Lost / Missing (0 pts)'};
  const lbl=$('lender-rating-label'); if(lbl) lbl.textContent='Selected: '+labels[n];
  refreshIcons();
}

function confirmReturn(txId) {
  const tx = getTx(txId); if(!tx) return;
  tx.conditionRating = lenderReturnRating;
  tx.lenderNotes = ($('lender-return-notes')?.value||tx.lenderNotes||'').trim();
  tx.status = 'returned';
  tx.returnedAt = tx.returnRequestAt || new Date().toISOString().split('T')[0];
  tx.credit = computeTransactionScore(tx);
  toast(`Return confirmed! Score ${tx.credit.score100}/100 → ${tx.credit.stars.toFixed(1)}★ (Punct ${tx.credit.punctuality} + Cond ${tx.credit.condition})`);
  closeModal('modal-details');
  renderBorrows(); renderRequests(); updateBadges(); renderProfile();
}

function markLost(txId){
  const tx=getTx(txId); if(!tx) return;
  tx.status='lost'; tx.conditionRating=null; tx.returnedAt=null; tx.returnRequestAt=new Date().toISOString().split('T')[0];
  tx.credit={score100:0, stars:0.0, punctuality:0, condition:0, rawStars:0};
  toast('Marked as lost - 0 points'); closeModal('modal-details'); renderBorrows(); renderRequests(); updateBadges(); renderProfile();
}

function denyReturn(txId) {
  const tx = getTx(txId); if(!tx) return;
  tx.status = 'active'; tx.returnRequestAt = null; tx.returnedAt = null; tx.conditionRating = null; tx.lenderNotes = ''; tx.credit = null;
  toast('Return denied'); closeModal('modal-details');
  renderBorrows(); updateBadges();
}


function renderRequests() {
  const pending = transactions.filter(tx =>
    tx.lender===currentUser && (tx.status==='requested'||tx.status==='pending_return')
  );
  $('requests-list').innerHTML = pending.length ? pending.map(tx => {
    const isBorrow = tx.status==='requested';
    const b = USERS[tx.borrower];
    return `<div class="card" onclick="openTransactionDetails(${tx.id})">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div class="item-name">${isBorrow?icon('package')+' Borrow Request':icon('rotate-ccw')+' Return Request'}</div>
        <span class="badge b-${tx.status}">${isBorrow?icon('clock-3')+' Pending':icon('rotate-ccw')+' Pending'}</span>
      </div>
      <div class="item-row">
        <div class="item-icon">${icon(tx.itemIcon)}</div>
        <div><div style="font-weight:700">${tx.itemName}</div><div class="item-meta">from ${b?b.name:'?'}</div></div>
      </div>
    </div>`;
  }).join('') : emptyState('sparkles','No pending requests!');
  refreshIcons();
}

// PROFILE - FIXED
function renderProfile(uid) {
  const targetId = uid || currentUser;
  if (!targetId || !USERS[targetId]) {
    $('profile-content').innerHTML = `<div class="card"><div class="empty-state"><p>Select a user to view their profile.</p></div></div>`;
    return;
  }
  const user = USERS[targetId];
  const credit = computeUserCredit(targetId);
  const txsAll = transactions.filter(tx => tx.borrower===targetId || tx.lender===targetId);
  const returned = txsAll.filter(t=>t.status==='returned').length;
  const late = txsAll.filter(t=>t.status==='late').length;
  const lost = txsAll.filter(t=>t.status==='lost').length;
  const total = txsAll.length;

  let statusText = 'New';
  if (credit.totalTx === 0) statusText = 'New';
  else if (credit.averageStars >= 4.0) statusText = 'Reliable';
  else if (credit.averageStars >= 3.0) statusText = 'Watchful';
  else statusText = 'Needs improvement';

  const sp = total ? Math.round(returned/total*100) : 0;
  const lp = total ? Math.round(late/total*100) : 0;
  const lop= total ? Math.round(lost/total*100) : 0;

  $('profile-content').innerHTML = `
    <div class="card avatar-wrap" style="cursor:default">
      <div class="avatar-icon">${icon(user.avatar)}</div>
      <div class="avatar-name">${user.name}</div>
      <div class="avatar-sub">@${targetId} • Profile: ${statusText}</div>
      <div style="margin-top:12px">${renderStarsHtml(credit.averageStars, '26px')} <span style="font-weight:800; margin-left:6px; vertical-align:middle">${credit.averageStars.toFixed(1)} / 5.0</span></div>
      <div class="divider"></div>
      <div class="info-row"><span class="info-label">Transactions (as borrower)</span><span class="info-value">${credit.totalTx}</span></div>
      <div class="info-row"><span class="info-label">Good (≥4★)</span><span class="info-value">${credit.goodPct}%</span></div>
      <div class="info-row"><span class="info-label">Late</span><span class="info-value">${credit.latePct}%</span></div>
      <div class="info-row"><span class="info-label">Lost / Problem</span><span class="info-value">${credit.lostPct}%</span></div>
    </div>



    <div class="stats-grid">
      <div class="stat-card" style="cursor:default"><div class="stat-number">${total}</div><div class="stat-label">Total</div></div>
      <div class="stat-card" style="cursor:default"><div class="stat-number">${returned}</div><div class="stat-label">On Time</div></div>
      <div class="stat-card" style="cursor:default"><div class="stat-number">${late}</div><div class="stat-label">Late</div></div>
      <div class="stat-card" style="cursor:default"><div class="stat-number">${lost}</div><div class="stat-label">Lost</div></div>
    </div>

    <div class="card" style="cursor:default">
      <div style="font-weight:900;margin-bottom:8px; display:flex; align-items:center; gap:6px"><i data-lucide="history"></i> Recent transactions (as borrower)</div>
      <div id="profile-tx-list">
        ${credit.txs.length ? credit.txs.slice(0,8).map(tx => {
          return `<div style="padding:8px 0;border-bottom:1px solid rgba(0,0,0,0.06);">
                    <div style="display:flex;justify-content:space-between;align-items:center">
                      <div>
                        <div style="font-weight:800">${tx.itemName}</div>
                        <div style="font-size:12px;color:var(--text-sub)">${USERS[tx.lender]?USERS[tx.lender].name:tx.lender} • ${tx.startDate || tx.requestedAt || ''} → ${tx.dueDate || ''}</div>
                      </div>
                      <div style="text-align:right">
                        ${renderStarsHtml(tx.credit.stars, '16px')}

function setAvatar(avatar) {
  USERS[currentUser].avatar = avatar;
  if (registeredAccounts[currentUser]) registeredAccounts[currentUser].avatar = avatar;
  $('header-user-display').textContent = USERS[currentUser].name;
  renderSettings();
}

function setTheme(t) {
  currentTheme = t;
  if (t==='orange') document.body.removeAttribute('data-theme');
  else document.body.setAttribute('data-theme', t);
  renderSettings();
  // refresh icons after theme change
  setTimeout(refreshIcons, 0);
}

function toggleSetting(key) {
  toggles[key] = !toggles[key];
  renderSettings();
}

function sendFriendRequest(toUid) {
  const fs = friendships[currentUser];
  if (!friendships[toUid]) friendships[toUid] = {friends:[],pendingIncoming:[],pendingOutgoing:[]};
  if (!fs.pendingOutgoing.includes(toUid)) {
    fs.pendingOutgoing.push(toUid);
    friendships[toUid].pendingIncoming.push(currentUser);
    toast(`Friend request sent to ${USERS[toUid].name}!`);
  }
  renderSettings();
}

function refreshListsAndProfile() {
  if (currentUser) renderProfile();
  renderBorrows();
  renderRequests();
  updateBadges();
}

document.addEventListener('DOMContentLoaded', () => {
  renderSignupAvatarGrid();
  refreshIcons();
  const loginUser = $('login-username');
  const loginPass = $('login-password');
  if (loginUser) loginUser.addEventListener('keydown', e => { if (e.key==='Enter') loginPass.focus(); });
  if (loginPass) loginPass.addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });

  // Observe theme changes to refresh icons
  new MutationObserver(mutations => {
    for (const m of mutations) {
      if (m.type === 'attributes' && m.attributeName === 'data-theme') {
        Promise.resolve().then(refreshIcons);
        break;
      }
    }
  }).observe(document.body, { attributes: true });
});

    /* ── DESKTOP DETECTION & SIDEBAR SYNC ───────────── */
    function isDesktop() { return window.innerWidth >= 900; }

    function syncDesktopSidebar() {
      const active = currentScreen || 'friends';
      document.querySelectorAll('.ds-nav-item').forEach(el => el.classList.remove('active'));
      const dsActive = document.getElementById('ds-nav-' + active);
      if (dsActive) dsActive.classList.add('active');
      // hide chat panel offset handling
      const chatPanel = document.getElementById('desktop-chat-panel');
      if (chatPanel && !chatPanel.classList.contains('open')) {
        document.body.classList.add('desktop-chat-closed');
      } else {
        document.body.classList.remove('desktop-chat-closed');
      }
    }

    function updateDesktopBadges() {
      const n = pendingCount(currentUser);
      const fr = pendingFriendRequests(currentUser);
      const reqEl = document.getElementById('ds-req-badge');
      const frEl = document.getElementById('ds-friend-badge');
      if (reqEl) { reqEl.textContent = n; reqEl.style.display = n>0 ? 'inline-flex' : 'none'; }
      if (frEl) { frEl.textContent = fr; frEl.style.display = fr>0 ? 'inline-flex' : 'none'; }
      const dsUser = document.getElementById('ds-user-display');
      const dsSub = document.getElementById('ds-user-sub');
      if (dsUser && currentUser && USERS[currentUser]) {
        dsUser.textContent = USERS[currentUser].name;
        if (dsSub) dsSub.textContent = '@' + currentUser;
      }
    }

    // Patch navigate to sync desktop sidebar
    const _origNavigate = navigate;
    navigate = function(screen) {
      _origNavigate(screen);
      syncDesktopSidebar();
    };

    // Patch updateBadges to also update desktop
    const _origUpdateBadges = updateBadges;
    updateBadges = function() {
      _origUpdateBadges();
      updateDesktopBadges();
    };

    // Patch doLoginAs to sync desktop
    const _origDoLoginAs = doLoginAs;
    doLoginAs = function(uid) {
      _origDoLoginAs(uid);
      setTimeout(() => { syncDesktopSidebar(); updateDesktopBadges(); refreshIcons(); }, 50);
    };

    // Desktop chat functions - side panel instead of modal
    function openDesktopChat(friendId) {
      currentChatFriend = friendId;
      const key = [currentUser, friendId].sort().join('-');
      if (!chats[key]) chats[key] = [];
      const credit = computeUserCredit(friendId);
      document.getElementById('ds-chat-friend-name').innerHTML = `${USERS[friendId].name} <span style="margin-left:8px">${renderStarsHtml(credit.averageStars,'12px')}</span>`;
      renderDesktopChatMessages(key);
      document.getElementById('ds-chat-input-field').value = '';
      document.getElementById('desktop-chat-panel').classList.add('open');
      document.body.classList.remove('desktop-chat-closed');
      refreshIcons();
    }

    function renderDesktopChatMessages(key) {
      const el = document.getElementById('ds-chat-messages');
      if (!el) return;
      el.innerHTML = (chats[key]||[]).map(m=>`<div class="message ${m.from===currentUser?'sent':'received'}"><div class="msg-bubble">${m.text}</div></div>`).join('');
      el.scrollTop = el.scrollHeight;
    }

    function closeDesktopChat() {
      document.getElementById('desktop-chat-panel').classList.remove('open');
      document.body.classList.add('desktop-chat-closed');
      currentChatFriend = null;
    }

    function sendDesktopMessage() {
      const inp = document.getElementById('ds-chat-input-field');
      const text = inp.value.trim(); if(!text) return;
      const key = [currentUser, currentChatFriend].sort().join('-');
      if (!chats[key]) chats[key] = [];
      chats[key].push({from: currentUser, text, time: new Date().toLocaleTimeString()});
      inp.value = '';
      renderDesktopChatMessages(key);
      // also sync to mobile chat view
      renderChatMessages(key);
    }

    function requestBorrowFromDesktopChat() {
      if (!currentChatFriend) return;
      borrowFormState.targetFriend = currentChatFriend;
      openBorrowModal();
    }

    // Override openChat to use desktop panel on desktop
    const _origOpenChat = openChat;
    openChat = function(friendId) {
      if (isDesktop()) {
        openDesktopChat(friendId);
      } else {
        _origOpenChat(friendId);
      }
    };

    // Add enter key for desktop chat
    document.addEventListener('DOMContentLoaded', () => {
      const dsInput = document.getElementById('ds-chat-input-field');
      if (dsInput) {
        dsInput.addEventListener('keydown', e => { if(e.key==='Enter') sendDesktopMessage(); });
      }
      // initial sync
      syncDesktopSidebar();
      window.addEventListener('resize', () => {
        syncDesktopSidebar();
        // if switching from desktop to mobile, close desktop chat panel if open
        if (!isDesktop()) {
          const panel = document.getElementById('desktop-chat-panel');
          if (panel) panel.classList.remove('open');
          document.body.classList.add('desktop-chat-closed');
        }
      });
    });

</script>
