<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trustr</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

    :root {
      --grad-top:    #FFAA6B;
      --grad-bot:    #FF5C5C;
      --teal:        #5BA8A0;
      --teal-dark:   #4A9490;
      --teal-light:  #E0F2F1;
      --purple:      #3C0060;
      --purple-mid:  #6B0FA0;
      --danger:      #D93030;
      --danger-light:#FDEAEA;
      --success:     #2E9E6B;
      --success-light:#E0F5EC;
      --warning:     #C97A00;
      --warning-light:#FFF3DC;
      --card:        #F0EEEE;
      --card-border: rgba(0,0,0,0.07);
      --text:        #111111;
      --text-sub:    #555;
      --hdr-h:       64px;
      --tab-h:       48px;
    }

    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(170deg, var(--grad-top) 0%, var(--grad-bot) 100%);
      background-attachment: fixed;
      color: var(--text);
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
    }

    /* ── AUTH SCREEN ─────────────────────────────── */
    #auth-screen {
      position: fixed; inset: 0;
      background: linear-gradient(170deg, var(--grad-top) 0%, var(--grad-bot) 100%);
      z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px 16px; overflow-y: auto;
    }
    #auth-screen.hidden { display: none; }
    .auth-card {
      background: white; border-radius: 24px;
      padding: 28px 22px; width: 100%; max-width: 390px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }
    .auth-logo { text-align: center; margin-bottom: 22px; }
    .auth-shield {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #FF8C00, #FF4444);
      border-radius: 18px; display: flex; align-items: center;
      justify-content: center; font-size: 36px; margin: 0 auto 12px;
      box-shadow: 0 4px 16px rgba(255,100,0,0.35);
    }
    .auth-logo-text {
      font-size: 26px; font-weight: 900; letter-spacing: 1px;
      background: linear-gradient(135deg, var(--purple), var(--purple-mid));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .auth-tabs {
      display: flex; background: #F0F0F0; border-radius: 12px;
      padding: 3px; margin-bottom: 20px;
    }
    .auth-tab {
      flex: 1; padding: 9px; text-align: center; border: none;
      background: transparent; border-radius: 9px;
      font-size: 14px; font-weight: 700; cursor: pointer;
      transition: all 0.2s; font-family: inherit; color: #888;
    }
    .auth-tab.active { background: white; color: var(--purple); box-shadow: 0 1px 4px rgba(0,0,0,0.12); }
    .test-box {
      background: rgba(91,168,160,0.08); border: 1.5px solid rgba(91,168,160,0.25);
      border-radius: 12px; padding: 12px; margin-bottom: 16px;
    }
    .test-box-label { font-size:11px; font-weight:800; color:var(--teal); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
    .test-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 12px; border-radius: 20px; border: none;
      background: rgba(91,168,160,0.15); color: var(--teal-dark);
      font-size: 13px; font-weight: 700; cursor: pointer;
      margin: 3px; font-family: inherit; transition: all 0.15s;
    }
    .test-btn:active { opacity: 0.7; transform: scale(0.95); }
    .test-hint { font-size: 11px; color: var(--text-sub); margin-top: 7px; }
    .av-signup-grid { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .av-signup-opt {
      width: 42px; height: 42px; border-radius: 10px; font-size: 22px;
      display: flex; align-items: center; justify-content: center;
      border: 2.5px solid transparent; cursor: pointer;
      background: rgba(0,0,0,0.04); transition: all .15s;
    }
    .av-signup-opt.sel { border-color: var(--teal); background: var(--teal-light); }

    /* ── HEADER ─────────────────────────────────── */
    .header {
      position: fixed; top: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px; height: var(--hdr-h);
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    }
    .logo-wrap { display:flex; align-items:center; gap:8px; }
    .logo-shield {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #FF8C00, #FF4444);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; box-shadow: 0 2px 6px rgba(255,100,0,0.35);
    }
    .logo-text {
      font-size: 20px; font-weight: 900; letter-spacing: 1px;
      background: linear-gradient(135deg, var(--purple) 0%, var(--purple-mid) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header-right { display:flex; align-items:center; gap:8px; }
    #header-user-display { font-size:13px; font-weight:800; color:var(--text); }
    .logout-btn {
      padding: 5px 11px; border-radius: 14px; border: none;
      background: #F0F0F0; color: #777; font-size: 12px;
      font-weight: 700; cursor: pointer; font-family: inherit; transition: all .15s;
    }
    .logout-btn:active { opacity: .7; }

    /* ── TAB BAR ─────────────────────────────────── */
    .tab-bar {
      position: fixed; top: var(--hdr-h); left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px; height: var(--tab-h);
      background: rgba(200,190,190,0.55); backdrop-filter: blur(6px);
      display: flex; align-items: center;
      padding: 6px 10px; gap: 6px; z-index: 99; overflow-x: auto; scrollbar-width: none;
    }
    .tab-bar::-webkit-scrollbar { display:none; }
    .tab-pill {
      flex-shrink: 0; padding: 6px 14px; border-radius: 20px; border: none;
      background: rgba(255,255,255,0.3); color: rgba(255,255,255,0.9);
      font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s; font-family: inherit;
    }
    .tab-pill.active { background: rgba(255,255,255,0.95); color: var(--purple); }
    .tab-pill .pill-badge {
      display:inline-flex; align-items:center; justify-content:center;
      background: var(--danger); color:white; font-size:10px; font-weight:800;
      width:16px; height:16px; border-radius:50%; margin-left:4px; vertical-align:middle;
    }

    /* ── CONTENT ─────────────────────────────────── */
    .content {
      padding-top: calc(var(--hdr-h) + var(--tab-h) + 16px);
      padding-bottom: 28px; padding-left: 14px; padding-right: 14px; min-height: 100vh;
    }
    .screen { display:none; }
    .screen.active { display:block; }
    .section-title {
      font-size: 19px; font-weight: 900; color: var(--purple); margin-bottom: 14px;
      text-shadow: 0 1px 2px rgba(255,255,255,0.4);
    }
    .card {
      background: var(--card); border-radius: 16px; padding: 14px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.13); margin-bottom: 12px;
      border: 1px solid var(--card-border); cursor: pointer; transition: all 0.15s;
    }
    .card:active { transform: scale(0.98); opacity: 0.9; }

    /* ── STATUS BADGES ───────────────────────────── */
    .badge { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; }
    .b-requested      { background:var(--warning-light); color:var(--warning); }
    .b-active         { background:var(--success-light); color:var(--success); }
    .b-pending_return { background:var(--teal-light);    color:var(--teal-dark); }
    .b-returned       { background:#EBEBEB;              color:#555; }
    .b-late           { background:var(--danger-light);  color:var(--danger); }
    .b-lost           { background:#1F2937;              color:white; }

    /* ── BUTTONS ─────────────────────────────────── */
    .btn {
      padding: 11px 16px; border-radius: 25px; border: none;
      font-size: 14px; font-weight: 700; cursor: pointer;
      transition: all 0.15s; display:inline-flex; align-items:center;
      justify-content:center; gap:6px; font-family:inherit;
    }
    .btn:active { transform:scale(0.96); opacity:0.9; }
    .btn-primary { background:var(--teal);   color:white; }
    .btn-success { background:var(--teal);   color:white; }
    .btn-danger  { background:var(--danger); color:white; }
    .btn-outline { background:transparent; color:var(--teal); border:2px solid var(--teal); }
    .btn-ghost   { background:rgba(255,255,255,0.6); color:var(--text); }
    .btn-full    { width:100%; }
    .btn-sm      { padding:7px 14px; font-size:13px; }

    /* ── FAB ─────────────────────────────────────── */
    .fab {
      position:fixed; bottom:28px; right:calc(50% - 215px + 14px);
      width:56px; height:56px; border-radius:50%; border:none;
      background:linear-gradient(135deg, var(--teal), var(--teal-dark));
      color:white; font-size:24px;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; z-index:90;
      box-shadow:0 4px 16px rgba(91,168,160,0.4); transition:all 0.2s;
    }
    .fab:active { transform:scale(0.9); }
    .fab.hidden { display:none; }

    /* ── FORM ────────────────────────────────────── */
    .form-group { margin-bottom:14px; }
    .form-label { font-size:12px; font-weight:700; color:var(--text-sub); margin-bottom:6px; display:block; text-transform:uppercase; letter-spacing:.4px; }
    .form-input {
      width:100%; padding:11px 14px; border:1.5px solid rgba(0,0,0,0.12); border-radius:12px;
      font-size:15px; outline:none; transition:border-color 0.2s; font-family:inherit; color:var(--text); background:white;
    }
    .form-input:focus { border-color:var(--teal); }
    .form-select {
      width:100%; padding:11px 14px; border:1.5px solid rgba(0,0,0,0.12); border-radius:12px;
      font-size:15px; outline:none; font-family:inherit; color:var(--text); background:white;
      appearance:none; cursor:pointer;
    }

    /* ── INNER TABS ─────────────────────────────── */
    .inner-tabs { display:flex; gap:0; margin-bottom:16px; background:rgba(0,0,0,0.12); border-radius:14px; padding:3px; }
    .inner-tab {
      flex:1; padding:8px; text-align:center; border:none; background:transparent; border-radius:11px;
      font-size:13px; font-weight:700; color:rgba(255,255,255,0.7); cursor:pointer; transition:all 0.2s; font-family:inherit;
    }
    .inner-tab.active { background:white; color:var(--purple); box-shadow:0 1px 4px rgba(0,0,0,0.15); }

    /* ── INFO ROWS ───────────────────────────────── */
    .info-row { display:flex; justify-content:space-between; align-items:center; padding:7px 0; font-size:13px; border-bottom:1px solid rgba(0,0,0,0.06); }
    .info-row:last-child { border-bottom:none; }
    .info-label { color:var(--text-sub); }
    .info-value { font-weight:700; text-align:right; max-width:60%; }
    .divider { height:1px; background:rgba(0,0,0,0.08); margin:12px 0; }
    .empty-state { text-align:center; padding:48px 24px; }
    .empty-icon  { font-size:52px; margin-bottom:12px; }
    .empty-state p { font-size:15px; font-weight:600; color:rgba(255,255,255,0.85); }

    /* ── ITEM ROW ────────────────────────────────── */
    .item-row { display:flex; align-items:center; gap:12px; }
    .item-icon {
      font-size:28px; width:50px; height:50px; background:rgba(91,168,160,0.15);
      border-radius:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
    }
    .item-name { font-size:15px; font-weight:800; margin-bottom:2px; color:var(--text); }
    .item-meta { font-size:12px; color:var(--text-sub); margin-top:1px; }

    /* ── STATS ───────────────────────────────────── */
    .stats-grid  { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
    .stat-card   { border-radius:14px; padding:14px; text-align:center; background:var(--card); box-shadow:0 2px 8px rgba(0,0,0,0.1); }
    .stat-number { font-size:28px; font-weight:900; color:var(--purple); }
    .stat-label  { font-size:11px; color:var(--text-sub); margin-top:3px; font-weight:700; text-transform:uppercase; letter-spacing:.3px; }

    /* ── DUE CHIP ────────────────────────────────── */
    .due-chip { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:10px; }
    .due-ok   { background:var(--success-light); color:var(--success); }
    .due-soon { background:var(--warning-light);  color:var(--warning); }
    .due-over { background:var(--danger-light);   color:var(--danger); }

    /* ── FRIEND ROW ──────────────────────────────── */
    .friend-row { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid rgba(0,0,0,0.07); }
    .friend-row:last-child { border-bottom:none; }
    .friend-avatar { font-size:32px; width:48px; height:48px; display:flex; align-items:center; justify-content:center; background:rgba(91,168,160,0.15); border-radius:12px; }
    .friend-info { flex:1; }
    .friend-name { font-weight:800; font-size:14px; color:var(--text); }
    .friend-status { font-size:12px; color:var(--text-sub); margin-top:2px; }

    /* ── CHAT ────────────────────────────────────── */
    .chat-messages { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px; }
    .message { display:flex; gap:8px; margin-bottom:8px; }
    .message.sent { justify-content:flex-end; }
    .message.sent .msg-bubble { background:var(--teal); color:white; }
    .message.received .msg-bubble { background:#EBEBEB; color:var(--text); }
    .msg-bubble { max-width:75%; padding:10px 14px; border-radius:12px; font-size:13px; word-wrap:break-word; line-height:1.4; }
    .chat-input { padding:12px; border-top:1px solid rgba(0,0,0,0.1); display:flex; gap:8px; }
    .chat-input input { flex:1; padding:8px 12px; border:1px solid rgba(0,0,0,0.15); border-radius:20px; font-size:13px; font-family:inherit; outline:none; }
    .chat-input button { padding:8px 14px; background:var(--teal); color:white; border:none; border-radius:20px; cursor:pointer; font-weight:700; font-size:12px; font-family:inherit; }
    .chat-actions { display:flex; gap:8px; padding:12px; border-top:1px solid rgba(0,0,0,0.1); }
    .chat-actions button { flex:1; padding:8px 12px; background:var(--teal); color:white; border:none; border-radius:20px; cursor:pointer; font-weight:700; font-size:12px; font-family:inherit; }

    /* ── EMOJI PICKER ────────────────────────────── */
    .icon-grid { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:14px; }
    .icon-opt {
      width:48px; height:48px; border-radius:12px; font-size:26px;
      display:flex; align-items:center; justify-content:center;
      border:3px solid transparent; cursor:pointer; background:rgba(0,0,0,0.05); transition:all .15s;
    }
    .icon-opt.sel { border-color:var(--teal); background:var(--teal-light); }
    .icon-opt:active { transform:scale(.9); }

    /* ── STARS ───────────────────────────────────── */
    .star-row { display:flex; gap:5px; margin:6px 0 12px; }
    .star { font-size:26px; cursor:pointer; opacity:0.2; transition:opacity 0.15s, transform 0.1s; user-select:none; }
    .star.lit { opacity:1; }
    .star:active { transform:scale(1.3); }

    /* ── REP BAR ─────────────────────────────────── */
    .rep-row { margin-bottom:12px; }
    .rep-header { display:flex; justify-content:space-between; font-size:13px; font-weight:700; margin-bottom:5px; }
    .rep-bar  { background:#E0E0E0; border-radius:8px; height:9px; overflow:hidden; }
    .rep-fill { height:100%; border-radius:8px; transition:width 0.6s ease; }

    /* ── MODAL ───────────────────────────────────── */
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:200; align-items:flex-end; justify-content:center; }
    .modal-overlay.open { display:flex; }
    .modal { background:white; border-radius:24px 24px 0 0; padding:8px 18px 28px; width:100%; max-width:430px; max-height:88vh; overflow-y:auto; }
    .modal-handle { width:40px; height:4px; background:#DDD; border-radius:2px; margin:12px auto 18px; }
    .modal-title  { font-size:19px; font-weight:900; color:var(--purple); margin-bottom:16px; }

    /* ── TOAST ───────────────────────────────────── */
    .toast {
      position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(12px);
      background:#1F2937; color:white; padding:11px 20px; border-radius:25px;
      font-size:14px; font-weight:700; z-index:1000; opacity:0; transition:all 0.28s;
      white-space:nowrap; pointer-events:none;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ── PROFILE ─────────────────────────────────── */
    .avatar-wrap { text-align:center; padding:24px 16px 18px; }
    .avatar-icon { font-size:72px; display:block; margin-bottom:8px; }
    .avatar-name  { font-size:22px; font-weight:900; color:var(--purple); }
    .avatar-sub   { color:var(--text-sub); font-size:13px; font-weight:600; margin-top:4px; }

    /* ── SETTINGS ────────────────────────────────── */
    .sett-section-label { font-size:11px; font-weight:800; color:rgba(255,255,255,0.55); text-transform:uppercase; letter-spacing:.8px; margin:16px 0 6px; padding:0 2px; }
    .theme-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .theme-opt { border:3px solid transparent; border-radius:14px; cursor:pointer; padding:10px 6px; text-align:center; transition:all .2s; background:rgba(0,0,0,0.04); }
    .theme-opt.sel { border-color:var(--teal); }
    .theme-preview { height:44px; border-radius:9px; margin-bottom:8px; display:flex; align-items:center; justify-content:center; font-size:18px; }
    .theme-label { font-size:11px; font-weight:800; color:var(--text-sub); }
    .toggle-row { display:flex; align-items:center; justify-content:space-between; padding:13px 2px; }
    .toggle-row + .toggle-row { border-top:1px solid rgba(0,0,0,0.06); }
    .toggle-lbl { font-size:15px; font-weight:700; color:var(--text); }
    .toggle-sub { font-size:12px; color:var(--text-sub); margin-top:1px; }
    .tog-track { width:44px; height:24px; border-radius:12px; background:#D0D0D0; position:relative; cursor:pointer; transition:background .2s; flex-shrink:0; }
    .tog-track.on { background:var(--teal); }
    .tog-thumb { position:absolute; width:20px; height:20px; background:white; border-radius:50%; top:2px; left:2px; transition:left .2s; box-shadow:0 1px 4px rgba(0,0,0,.25); }
    .tog-track.on .tog-thumb { left:22px; }

    /* ── Add-friend rows ──────────────────────────── */

    /* ---------- lucide SVG icon visibility / theme contrast ---------- */
    /* Ensure lucide SVGs inherit color and use stroke=currentColor */
    svg[data-lucide-icon], i[data-lucide] svg {
    display: inline-block;
    vertical-align: middle;
    color: inherit;            /* important so icons pick up parent color */
    stroke: currentColor !important;
    fill: none !important;     /* most lucide icons are stroked */
    stroke-width: 1.6px;
    }

    /* Global defaults for light / dark so icons contrast with background */
    body[data-theme="dark"] svg[data-lucide-icon] {
    color: #E8E8FF;    /* light/pale icon color on dark background */
    stroke: #E8E8FF;
    }

    }

    .fab svg {
    color: #fff;
    stroke: #fff;

    .af-avatar svg,
    .av-opt svg,
    .av-signup-opt svg,
    .av-signup-grid svg,

    }

    /* Buttons / title icons: use the same color as text by default */
    .btn svg,
    .test-btn svg,
    .section-title svg,
    .modal-title svg,
    .icon-opt svg,
    .icon-inline svg {
    color: inherit;
    stroke: currentColor;
    }
    // Refresh Lucide icons when the theme changes (or whenever data-theme is updated)
    function refreshIcons() {
    if (window.lucide && typeof lucide.createIcons === 'function') lucide.createIcons();
    }

    // Call once on load (you already do this) — keep it:
    // document.addEventListener('DOMContentLoaded', () => { refreshIcons(); ... });

    // Also observe the body data-theme attribute and refresh icons when it changes:
    new MutationObserver(mutations => {
    for (const m of mutations) {
    if (m.type === 'attributes' && m.attributeName === 'data-theme') {
      // allow the CSS to apply first (microtask)
      Promise.resolve().then(refreshIcons);
      break;
    }
    }
    }).observe(document.body, { attributes: true });
    /* Ensure lucide icon child shapes inherit currentColor and are not filled */
    svg[data-lucide-icon] *,
    i[data-lucide] svg * {
    stroke: currentColor !important;
    fill: none !important;
    }

}

function quickLogin(uid) {
  doLoginAs(uid);
}

function doLogin() {
  const username = ($('login-username').value || '').trim().toLowerCase();
  const password = $('login-password').value || '';
  if (!username || !password) { toast('Fill in both fields'); return; }
  if (!registeredAccounts[username]) { toast('Account not found'); return; }
  if (registeredAccounts[username].password !== password) { toast('Wrong password'); return; }
  doLoginAs(username);
}

function doSignup() {
  const username    = ($('signup-username').value    || '').trim().toLowerCase();
  const displayName = ($('signup-displayname').value || '').trim();
  const password    = $('signup-password').value || '';
  const confirm     = $('signup-confirm').value  || '';
  if (!username || !displayName || !password || !confirm) { toast('Fill in all fields'); return; }
  if (password !== confirm)              { toast('Passwords don\'t match'); return; }
  if (password.length < 3)              { toast('Password too short (min 3)'); return; }
  if (registeredAccounts[username])     { toast('Username already taken'); return; }
  if (!/^[a-z0-9_]+$/.test(username))  { toast('Username: letters, numbers, _ only'); return; }

  registeredAccounts[username] = { password, id:username, name:displayName, avatar:selectedSignupAvatar };
  USERS[username] = { id:username, name:displayName, avatar:selectedSignupAvatar };
  friendships[username] = { friends:[], pendingIncoming:[], pendingOutgoing:[] };

  doLoginAs(username);
}

function doLoginAs(uid) {
  currentUser = uid;
  if (!USERS[uid]) USERS[uid] = { ...registeredAccounts[uid] };
  if (!friendships[uid]) friendships[uid] = { friends:[], pendingIncoming:[], pendingOutgoing:[] };

  $('header-user-display').textContent = USERS[uid].name;
  $('auth-screen').classList.add('hidden');
  render('friends');
  navigate('friends');
  toast('Welcome, ' + USERS[uid].name + '!');
}

function doLogout() {
  currentUser = null;
  $('auth-screen').classList.remove('hidden');
  if ($('login-username')) $('login-username').value = '';
  if ($('login-password')) $('login-password').value = '';
}

// Enter key on login fields
document.addEventListener('DOMContentLoaded', () => {
  renderSignupAvatarGrid();
  refreshIcons();
  $('login-password').addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });
  $('login-username').addEventListener('keydown', e => { if (e.key==='Enter') $('login-password').focus(); });
});

// ──────────────────────────────────────────────
//  HELPERS
// ──────────────────────────────────────────────

const $ = id => document.getElementById(id);

function icon(name, cls='') {
  return `<i data-lucide="${name}"${cls ? ` class="${cls}"` : ''}></i>`;
}

function refreshIcons() {
  if (window.lucide) lucide.createIcons();
}

function starIcons(count) {
  return Array.from({length:5}, (_,i) => icon('star', i < count ? 'star lit' : 'star')).join('');
}

function toast(msg) {
  const el = $('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2800);
}

function closeModal(id) { $(id).classList.remove('open'); }
function openModal(id)  { $(id).classList.add('open'); }

document.querySelectorAll('.modal-overlay').forEach(o =>
  o.addEventListener('click', e => { if (e.target===o) o.classList.remove('open'); })
);

function fmt(ds) {
  if (!ds) return '—';
  return new Date(ds+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

function dueChip(ds) {
  const due = new Date(ds+'T23:59:59');
  const diff = Math.ceil((due - NOW) / 864e5);
  if (diff<0)   return `<span class="due-chip due-over">${icon('circle')} ${Math.abs(diff)}d overdue</span>`;
  if (diff===0) return `<span class="due-chip due-soon">${icon('triangle-alert')} Due today</span>`;
  if (diff<=3)  return `<span class="due-chip due-soon">${icon('zap')} ${diff}d left</span>`;
  return `<span class="due-chip due-ok">${icon('calendar-days')} ${diff}d left</span>`;
}

function isLate(tx) {
  const due = new Date(tx.dueDate+'T23:59:59');
  if (!tx.returnRequestAt) return NOW > due;
  return new Date(tx.returnRequestAt+'T23:59:59') > due;
}

function getTx(id) { return transactions.find(t => t.id===id); }

function pendingCount(uid) {
  return transactions.filter(tx => tx.lender===uid && (tx.status==='requested'||tx.status==='pending_return')).length;
}

function pendingFriendRequests(uid) {
  return (friendships[uid]||{pendingIncoming:[]}).pendingIncoming.length;
}

function updateBadges() {
  const n  = pendingCount(currentUser);
  const el = $('req-badge');
  el.textContent = n; el.style.display = n>0 ? 'inline-flex' : 'none';
  const fr  = pendingFriendRequests(currentUser);
  const el2 = $('friend-req-badge');
  el2.textContent = fr; el2.style.display = fr>0 ? 'inline-flex' : 'none';
}

function iconEl(name) { return icon(name); }

function emptyState(icon, msg) {
  return `<div class="empty-state"><div class="empty-icon">${iconEl(icon)}</div><p>${msg}</p></div>`;
}

function updateFABVisibility() {
  const fab = $('fab-borrow');
  (currentScreen==='borrows'||currentScreen==='requests') ? fab.classList.remove('hidden') : fab.classList.add('hidden');
}

let currentScreen = 'friends';

function navigate(screen) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-pill').forEach(n => n.classList.remove('active'));
  $('screen-'+screen).classList.add('active');
  $('nav-'+screen).classList.add('active');

  render(screen);
  updateFABVisibility();
}

function render(screen) {
  if (screen==='friends')  renderFriends();
  if (screen==='borrows')  renderBorrows();
  if (screen==='requests') renderRequests();

}

let friendsTab = 'my-friends';
let currentChatFriend = null;

function switchFriendsTab(tab) {
  friendsTab = tab;
  $('tab-my-friends').classList.toggle('active', tab==='my-friends');
  $('tab-pending-req').classList.toggle('active', tab==='pending-req');
  $('friends-my-friends').style.display  = tab==='my-friends'  ? 'block' : 'none';
  $('friends-pending-req').style.display = tab==='pending-req' ? 'block' : 'none';
}

function renderFriends() {
  const fs = friendships[currentUser] || {friends:[],pendingIncoming:[]};
  const myFriends   = (fs.friends||[]).map(id=>USERS[id]).filter(Boolean);
  const pendingReqs = (fs.pendingIncoming||[]).map(id=>USERS[id]).filter(Boolean);

  $('friends-my-friends').innerHTML = myFriends.length
    ? myFriends.map(f=>`
        <div class="card">
          <div class="friend-row">
            <div class="friend-avatar">${icon(f.avatar)}</div>
            <div class="friend-info"><div class="friend-name">${f.name}</div><div class="friend-status"> Friend</div></div>
            <button class="btn btn-sm btn-primary" onclick="openChat('${f.id}')"><i data-lucide="message-circle"></i> Chat</button>
          </div>
        </div>`).join('')
    : emptyState('frown','No friends yet. Add some in Settings!');

  $('friends-pending-req').innerHTML = pendingReqs.length
    ? pendingReqs.map(f=>`
        <div class="card">
          <div class="friend-row">
            <div class="friend-avatar">${icon(f.avatar)}</div>
            <div class="friend-info"><div class="friend-name">${f.name}</div><div class="friend-status"><i data-lucide="clock-3"></i> Wants to be friends</div></div>
          </div>
          <div style="display:flex;gap:8px;margin-top:10px">
            <button class="btn btn-danger btn-sm" style="flex:1" onclick="respondFriendRequest('${f.id}',false)"><i data-lucide="x"></i> Deny</button>
            <button class="btn btn-success btn-sm" style="flex:2" onclick="respondFriendRequest('${f.id}',true)"><i data-lucide="check"></i> Accept</button>
          </div>
        </div>`).join('')
    : emptyState('party-popper','No pending friend requests!');
}

function respondFriendRequest(uid, accept) {
  const fs = friendships[currentUser];
  const idx = fs.pendingIncoming.indexOf(uid);
  if (idx===-1) return;
  fs.pendingIncoming.splice(idx,1);
  if (accept) {
    fs.friends.push(uid);
    const o = friendships[uid];
    if (o) { const i2=o.pendingOutgoing.indexOf(currentUser); if(i2!==-1) o.pendingOutgoing.splice(i2,1); if(!o.friends.includes(currentUser)) o.friends.push(currentUser); }
    toast(`You're now friends with ${USERS[uid].name}!`);
  } else {
    const o = friendships[uid];
    if (o) { const i2=o.pendingOutgoing.indexOf(currentUser); if(i2!==-1) o.pendingOutgoing.splice(i2,1); }
    toast('Friend request declined');
  }
  renderFriends(); updateBadges();
}

function openChat(friendId) {
  currentChatFriend = friendId;
  const key = [currentUser,friendId].sort().join('-');

  $('chat-friend-name').textContent = `${USERS[friendId].name}`;

  $('chat-input-field').value = '';
  openModal('modal-chat');
}

function renderChatMessages(key) {
  const el = $('chat-messages');
  el.innerHTML = (chats[key]||[]).map(m=>`
    <div class="message ${m.from===currentUser?'sent':'received'}">
      <div class="msg-bubble">${m.text}</div>
    </div>`).join('');
  el.scrollTop = el.scrollHeight;

function sendMessage() {
  const inp = $('chat-input-field'), text = inp.value.trim(); if(!text) return;
  const key = [currentUser,currentChatFriend].sort().join('-');
  if (!chats[key]) chats[key]=[];
  chats[key].push({from:currentUser,text,time:new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})});
  inp.value = ''; renderChatMessages(key);

function requestBorrowFromChat() {

function submitBorrowRequest() {
  const friendId = $('borrow-friend').value;

  if (!friendId || !itemName || !dueDate) { toast('Please fill all required fields'); return; }

  transactions.push({
    id: nextTxId++, borrower: currentUser, lender: friendId,
    itemName, itemIcon: borrowFormState.itemIcon,
    itemCondition: $('borrow-condition').value, itemNotes:'',
    status:'requested',
    requestedAt: NOW.toISOString().split('T')[0], startDate:null, dueDate,
    returnRequestAt:null, returnedAt:null, conditionRating:null, lenderNotes:'',
    borrowerNote: ($('borrow-note').value||'').trim()
  });

  toast(`Request sent to ${USERS[friendId].name}!`);
  closeModal('modal-borrow');
  borrowFormState = { itemName:'', itemIcon:'package', itemCondition:'Good', dueDate:'', borrowerNote:'', targetFriend:null };
  renderBorrows(); updateBadges();
}

function openTransactionDetails(txId) {
  const tx = getTx(txId); if (!tx) return;
  const isBorrower = currentUser===tx.borrower;
  const other = USERS[isBorrower?tx.lender:tx.borrower];

  let html = `
    <div class="card" style="margin-bottom:14px">
      <div class="item-row" style="margin-bottom:14px">
        <div class="item-icon" style="font-size:40px;width:60px;height:60px">${icon(tx.itemIcon)}</div>

      </div>
      <div class="divider"></div>
      <div class="info-row"><span class="info-label">Status</span><span class="badge b-${tx.status}">${
        {requested:icon('clock-3')+' Pending',active:icon('check')+' Active',pending_return:icon('rotate-cw')+' Return Pending',returned:icon('check')+' Returned',lost:icon('x-circle')+' Lost'}[tx.status]||tx.status
      }</span></div>
      <div class="info-row"><span class="info-label">Condition</span><span class="info-value">${tx.itemCondition}</span></div>
      <div class="info-row"><span class="info-label">Due Date</span><span class="info-value">${fmt(tx.dueDate)}</span></div>
      <div class="info-row"><span class="info-label">Requested</span><span class="info-value">${fmt(tx.requestedAt)}</span></div>
      ${tx.startDate  ? `<div class="info-row"><span class="info-label">Started</span><span class="info-value">${fmt(tx.startDate)}</span></div>` : ''}
      ${tx.returnedAt ? `<div class="info-row"><span class="info-label">Returned</span><span class="info-value">${fmt(tx.returnedAt)}</span></div>` : ''}
      ${tx.borrowerNote ? `<div class="info-row"><span class="info-label">Note</span><span class="info-value">${tx.borrowerNote}</span></div>` : ''}
      ${tx.lenderNotes  ? `<div class="info-row"><span class="info-label">Lender note</span><span class="info-value">${tx.lenderNotes}</span></div>` : ''}
      ${tx.conditionRating ? `<div class="info-row"><span class="info-label">Rating</span><span class="info-value">${starIcons(tx.conditionRating)}</span></div>` : ''}
    </div>`;

  if (tx.status==='requested' && !isBorrower) {
    html += `<div style="display:flex;gap:8px">
      <button class="btn btn-danger" style="flex:1" onclick="rejectBorrowRequest(${txId})"><i data-lucide="x"></i> Reject</button>
      <button class="btn btn-success" style="flex:1" onclick="approveBorrowRequest(${txId})"><i data-lucide="check"></i> Approve</button>
    </div>`;
  } else if (tx.status==='active' && isBorrower) {
    html += `<button class="btn btn-primary btn-full" onclick="openReturnModal(${txId})"><i data-lucide="rotate-cw"></i> Request Return</button>`;
  } else if (tx.status==='pending_return' && !isBorrower) {
    html += `<div style="display:flex;gap:8px">
      <button class="btn btn-danger" style="flex:1" onclick="denyReturn(${txId})"><i data-lucide="x"></i> Deny Return</button>

    </div>`;

}

function approveBorrowRequest(txId) {
  const tx = getTx(txId); if(!tx) return;
  tx.status = 'active'; tx.startDate = NOW.toISOString().split('T')[0];
  toast('Borrow approved!'); closeModal('modal-details');
  renderBorrows(); renderRequests(); updateBadges();
}

function rejectBorrowRequest(txId) {
  transactions = transactions.filter(t => t.id!==txId);
  toast('Request rejected'); closeModal('modal-details');
  renderBorrows(); renderRequests(); updateBadges();
}

window.currentReturnRating = 5;

function openReturnModal(txId) {
  const tx = getTx(txId); if(!tx) return;
  $('modal-return-body').innerHTML = `
    <div class="form-group">
      <label class="form-label"><i data-lucide="star"></i> Condition Rating</label>
      <div class="star-row" id="star-row">
        ${[1,2,3,4,5].map(n=>`<span class="star${n<=window.currentReturnRating?' lit':''}" onclick="setRating(${n})">${icon('star')}</span>`).join('')}
      </div>
    </div>
    <div class="form-group">
      <label class="form-label"><i data-lucide="notebook-pen"></i> Notes</label>
      <input type="text" id="return-notes" class="form-input" placeholder="Any damages or notes?">
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-ghost" style="flex:1" onclick="closeModal('modal-return')">Cancel</button>
      <button class="btn btn-primary" style="flex:2" onclick="submitReturn(${txId})"><i data-lucide="package"></i> Send Return</button>
    </div>`;
  closeModal('modal-details'); openModal('modal-return');
  refreshIcons();
}

function setRating(n) {
  window.currentReturnRating = n;
  document.querySelectorAll('#star-row .star').forEach((s,i) => s.classList.toggle('lit', i<n));
}

function submitReturn(txId) {
  const tx = getTx(txId); if(!tx) return;
  tx.status = 'pending_return';
  tx.returnRequestAt = NOW.toISOString().split('T')[0];
  tx.conditionRating = window.currentReturnRating;
  tx.lenderNotes = ($('return-notes').value||'').trim();
  toast('Return request sent!'); closeModal('modal-return');
  renderBorrows(); renderRequests(); updateBadges();
}

function confirmReturn(txId) {
  const tx = getTx(txId); if(!tx) return;
  tx.status = 'returned'; tx.returnedAt = NOW.toISOString().split('T')[0];
  toast('Return confirmed!'); closeModal('modal-details');
  renderBorrows(); updateBadges();

function denyReturn(txId) {
  const tx = getTx(txId); if(!tx) return;
  tx.status = 'active'; tx.returnRequestAt = null; tx.conditionRating = null; tx.lenderNotes = '';
  toast('Return denied'); closeModal('modal-details');

}

function renderRequests() {
  const pending = transactions.filter(tx =>
    tx.lender===currentUser && (tx.status==='requested'||tx.status==='pending_return')
  );
  $('requests-list').innerHTML = pending.length ? pending.map(tx => {
    const isBorrow = tx.status==='requested';
    const b = USERS[tx.borrower];
    return `<div class="card" onclick="openTransactionDetails(${tx.id})">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div class="item-name">${isBorrow?icon('package')+' Borrow Request':icon('rotate-cw')+' Return Request'}</div>
        <span class="badge b-${tx.status}">${isBorrow?'<i data-lucide="clock-3"></i> Pending':'<i data-lucide="rotate-cw"></i> Pending'}</span>
      </div>
      <div class="item-row">
        <div class="item-icon">${icon(tx.itemIcon)}</div>
        <div><div style="font-weight:700">${tx.itemName}</div><div class="item-meta">from ${b?b.name:'?'}</div></div>
      </div>
    </div>`;
  }).join('') : emptyState('sparkles','No pending requests!');
}

// ──────────────────────────────────────────────
//  PROFILE
// ──────────────────────────────────────────────

function renderProfile() {
  const u = USERS[currentUser];
  const txs = transactions.filter(tx => tx.borrower===currentUser||tx.lender===currentUser);
  const returned = txs.filter(t=>t.status==='returned').length;
  const late     = txs.filter(t=>t.status==='late').length;
  const lost     = txs.filter(t=>t.status==='lost').length;
  const total    = txs.length;
  const sp = total ? Math.round(returned/total*100) : 0;
  const lp = total ? Math.round(late/total*100) : 0;
  const lop= total ? Math.round(lost/total*100) : 0;

  $('profile-content').innerHTML = `
    <div class="avatar-wrap">
      <span class="avatar-icon">${icon(u.avatar)}</span>
      <div class="avatar-name">${u.name}</div>
      <div class="avatar-sub">@${currentUser}</div>
    </div>
    <div class="section-title">Reliability Score</div>
    <div class="card">
      <div class="rep-row"><div class="rep-header"><span>Good Transactions</span><span style="color:var(--success)">${sp}%</span></div><div class="rep-bar"><div class="rep-fill" style="width:${sp}%;background:var(--success)"></div></div></div>
      <div class="rep-row"><div class="rep-header"><span>Late Returns</span><span style="color:var(--warning)">${lp}%</span></div><div class="rep-bar"><div class="rep-fill" style="width:${lp}%;background:var(--warning)"></div></div></div>
      <div class="rep-row"><div class="rep-header"><span>Lost Items</span><span style="color:var(--danger)">${lop}%</span></div><div class="rep-bar"><div class="rep-fill" style="width:${lop}%;background:var(--danger)"></div></div></div>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-number">${total}</div><div class="stat-label">Total</div></div>
      <div class="stat-card"><div class="stat-number">${returned}</div><div class="stat-label">On Time</div></div>
      <div class="stat-card"><div class="stat-number">${late}</div><div class="stat-label">Late</div></div>
      <div class="stat-card"><div class="stat-number">${lost}</div><div class="stat-label">Lost</div></div>
    </div>
    <button class="btn btn-primary btn-full" onclick="openNameModal()"><i data-lucide="pencil"></i> Change Display Name</button>`;
}

function openNameModal() {
  $('modal-name-body').innerHTML = `
    <div class="form-group">
      <label class="form-label">Display Name</label>
      <input type="text" id="name-input" class="form-input" value="${USERS[currentUser].name}" maxlength="20">
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-ghost" style="flex:1" onclick="closeModal('modal-name')">Cancel</button>
      <button class="btn btn-primary" style="flex:2" onclick="saveName()"><i data-lucide="check"></i> Save</button>
    </div>`;
  openModal('modal-name');
  refreshIcons();
  setTimeout(()=>{ const i=$('name-input'); if(i){i.focus();i.select();} },100);
}

function saveName() {
  const val = ($('name-input').value||'').trim();
  if (!val) { toast('Name cannot be empty'); return; }
  USERS[currentUser].name = val;
  $('header-user-display').textContent = val;
  closeModal('modal-name'); toast('Name updated!'); renderProfile();
}

// ──────────────────────────────────────────────
//  SETTINGS
// ──────────────────────────────────────────────

function renderSettings() {
  const me = USERS[currentUser];
  const fs = friendships[currentUser]||{friends:[],pendingIncoming:[],pendingOutgoing:[]};
  const myFriends = fs.friends; const myOut = fs.pendingOutgoing;

  const discoverable = Object.keys(USERS).filter(uid =>
    uid!==currentUser && !myFriends.includes(uid) && !fs.pendingIncoming.includes(uid)
  );
  const filtered = friendSearchQ
    ? discoverable.filter(uid => USERS[uid].name.toLowerCase().includes(friendSearchQ.toLowerCase()))
    : discoverable;

  const themes = [
    { key:'orange', label:'Sunrise', icon:'sunrise', style:'background:linear-gradient(135deg,#FFAA6B,#FF5C5C)' },
    { key:'light',  label:'Light',   icon:'sun',  style:'background:#EEEEF8;border:1px solid #DDD' },
    { key:'dark',   label:'Dark',    icon:'moon',  style:'background:linear-gradient(135deg,#0D0D1A,#1A1A30)' },
  ];

  const notifToggles = [
    { key:'borrowNotifs',    label:'Borrow Requests',  sub:'When someone wants to borrow your item' },
    { key:'returnReminders', label:'Return Reminders',  sub:'Reminder before your due date' },
    { key:'friendRequests',  label:'Friend Requests',   sub:'When someone sends you a friend request' },
    { key:'lateAlerts',      label:'Late Alerts',       sub:'Alert when a return is overdue' },
  ];

  $('settings-content').innerHTML = `
    <div class="sett-section-label">Profile</div>
    <div class="card">
      <div style="display:flex;align-items:center;gap:14px">
        <div style="font-size:52px">${icon(me.avatar)}</div>
        <div>
          <div style="font-size:18px;font-weight:900;color:var(--text)">${me.name}</div>
          <div style="font-size:12px;color:var(--text-sub)">@${currentUser}</div>
        </div>
      </div>
    </div>

    <div class="sett-section-label">Avatar</div>
    <div class="card" style="text-align:center">
      <div style="font-size:12px;font-weight:700;color:var(--text-sub);margin-bottom:8px">Tap to change</div>
      <div class="av-grid">${AVATAR_OPTIONS.map(e=>`<div class="av-opt${me.avatar===e?' sel':''}" onclick="setAvatar('${e}')">${icon(e)}</div>`).join('')}</div>
    </div>

    <div class="sett-section-label">Add Friends</div>
    <div class="card">
      <input class="form-input" placeholder="Search users…" value="${friendSearchQ.replace(/"/g,'&quot;')}" oninput="friendSearchQ=this.value;renderSettings()" style="margin-bottom:${filtered.length?'12px':'0'}">
      ${filtered.map(uid => {
        const u=USERS[uid]; const ip=myOut.includes(uid); const iF=myFriends.includes(uid);
        return `<div class="af-row">
          <div class="af-avatar">${icon(u.avatar)}</div>
          <div style="flex:1"><div class="af-name">${u.name}</div><div class="af-status">${iF?icon('check')+' Friends':ip?'<i data-lucide="clock-3"></i> Request sent':'@'+uid}</div></div>
          ${!ip&&!iF?`<button class="btn btn-sm btn-outline" onclick="sendFriendRequest('${uid}')">+ Add</button>`:''}
        </div>`;
      }).join('')||(friendSearchQ?`<p style="text-align:center;padding:14px;color:var(--text-sub);font-size:14px;font-weight:600">No users found</p>`:'')}
    </div>

    <div class="sett-section-label">Appearance</div>
    <div class="card">
      <div class="theme-grid">
        ${themes.map(t=>`
          <div class="theme-opt${currentTheme===t.key?' sel':''}" onclick="setTheme('${t.key}')">
            <div class="theme-preview" style="${t.style}">${icon(t.icon)}</div>
            <div class="theme-label">${t.label}</div>
          </div>`).join('')}
      </div>
    </div>

    <div class="sett-section-label">Notifications</div>
    <div class="card">
      ${notifToggles.map(t=>`
        <div class="toggle-row">
          <div><div class="toggle-lbl">${t.label}</div><div class="toggle-sub">${t.sub}</div></div>
          <div class="tog-track${toggles[t.key]?' on':''}" onclick="toggleSetting('${t.key}')"><div class="tog-thumb"></div></div>
        </div>`).join('')}
    </div>

    <div class="sett-section-label">Account</div>
    <div class="card">
      <div class="info-row"><span class="info-label">Username</span><span class="info-value">@${currentUser}</span></div>
      <div class="info-row"><span class="info-label">Friends</span><span class="info-value">${myFriends.length}</span></div>
      <div class="info-row"><span class="info-label">Theme</span><span class="info-value">${themes.find(t=>t.key===currentTheme).label}</span></div>
      <div class="info-row"><span class="info-label">App</span><span class="info-value">Trustr v1.0</span></div>
    </div>
    <div style="height:12px"></div>`;
}

function setAvatar(avatar) {
  USERS[currentUser].avatar = avatar;
  $('header-user-display').textContent = USERS[currentUser].name;
  renderSettings();
  refreshIcons();
}

function setTheme(t) {
  currentTheme = t;
  document.body.setAttribute('data-theme', t==='orange' ? '' : t);
  renderSettings();
  refreshIcons();
}

function toggleSetting(key) {
  toggles[key] = !toggles[key];
  renderSettings();
  refreshIcons();
}

function sendFriendRequest(toUid) {
  const fs = friendships[currentUser];
  if (!friendships[toUid]) friendships[toUid] = {friends:[],pendingIncoming:[],pendingOutgoing:[]};
  if (!fs.pendingOutgoing.includes(toUid)) {
    fs.pendingOutgoing.push(toUid);
    friendships[toUid].pendingIncoming.push(currentUser);
    toast(`Friend request sent to ${USERS[toUid].name}!`);

  lucide.createIcons();
  }
  renderSettings();
  refreshIcons();
}
refreshIcons();
</script>
</body>
</html>
